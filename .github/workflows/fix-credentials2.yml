name: Normalize Final Credentials

on: [push]

jobs:
  normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize
        shell: bash
        run: |
          git show 0d5728b057eb4ddb55fe2e79a25a2ff8442f1c0c:index.html > /tmp/reference.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); h=p.read_text(encoding='utf-8'); r=Path('/tmp/reference.html').read_text(encoding='utf-8')
          s=r.rfind('<section class="section credentials-section" id="credentials">'); e=r.find('</section>',s)
          if s<0 or e<0: raise SystemExit('reference section missing')
          final=r[s:e+10]
          h=re.sub(r'\s*<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->\s*','\n',h,flags=re.S)
          h=re.sub(r'\s*<section[^>]+id=["\']credentials(?:-reference-design)?["\'][^>]*>.*?</section>\s*','\n',h,flags=re.S)
          h=re.sub(r'\s*<!-- SECTORS -->\s*','\n',h,flags=re.S)
          sec=re.search(r'<section[^>]+class=["\']section sectors["\'][^>]+id=["\']sectors["\'][^>]*>',h,re.I)
          if not sec: raise SystemExit('sectors missing')
          h=h[:sec.start()]+'\n<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->\n'+final+'\n\n<!-- SECTORS -->\n  '+h[sec.start():]
          p.write_text(h,encoding='utf-8')
          print('normalized')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize final credentials placement"
          git push
