name: One-Time Option 1 Flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Option 1 straight-line flow
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          old = '''    .risk-chain .chain {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .risk-chain .chain span {
      text-align: center;
      white-space: nowrap;
    }

    .risk-chain .chain span:nth-of-type(5) {
      grid-column: 1 / span 3;
    }

    .risk-chain .chain span:nth-of-type(6) {
      grid-column: 4 / span 2;
    }

    .risk-chain .chain span:nth-of-type(7) {
      grid-column: 6 / span 2;
    }

    .risk-chain .chain span:nth-of-type(8) {
      grid-column: 8 / span 2;
    }

    .risk-chain .chain span:nth-of-type(9) {
      grid-column: 10 / span 2;
    }'''

          new = '''    /* OPTION 1 — SINGLE STRAIGHT-LINE RISK FLOW */
    .risk-chain .chain {
      display: flex;
      flex-wrap: nowrap;
      gap: 5px;
      align-items: center;
      overflow-x: auto;
      padding: 2px 1px 6px;
      scrollbar-width: thin;
    }

    .risk-chain .chain span {
      flex: 1 1 0;
      min-width: 58px;
      text-align: center;
      white-space: normal;
      padding: 10px 7px;
      line-height: 1.2;
    }

    .risk-chain .chain b {
      flex: 0 0 auto;
      color: var(--accent-light);
      font-size: .85rem;
    }'''

          if old not in html:
              raise SystemExit("Expected risk-chain CSS block was not found; no change made.")

          html = html.replace(old, new, 1)

          old_mobile = '''      .risk-chain .chain { grid-template-columns: repeat(2, 1fr); }
      .risk-chain .chain span:nth-of-type(n) { grid-column: auto; }'''
          new_mobile = '''      .risk-chain .chain {
        overflow-x: auto;
        justify-content: flex-start;
      }
      .risk-chain .chain span {
        flex: 0 0 86px;
      }'''

          if old_mobile not in html:
              raise SystemExit("Expected mobile risk-chain CSS block was not found; no change made.")

          html = html.replace(old_mobile, new_mobile, 1)
          path.write_text(html, encoding="utf-8")

      - name: Commit website change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-option1-flow.yml
          git commit -m "Align risk chain in single straight-line flow"
          git push
