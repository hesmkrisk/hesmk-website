name: Apply HESMK Risk Flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace risk-chain layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    .risk-chain .chain {\n      display: grid;\n      grid-template-columns: repeat(11, minmax(0, 1fr));\n      gap: 8px;\n      align-items: center;\n    }\n\n    .risk-chain .chain span {\n      text-align: center;\n      white-space: nowrap;\n    }\n\n    .risk-chain .chain span:nth-of-type(5) {\n      grid-column: 1 / span 3;\n    }\n\n    .risk-chain .chain span:nth-of-type(6) {\n      grid-column: 4 / span 2;\n    }\n\n    .risk-chain .chain span:nth-of-type(7) {\n      grid-column: 6 / span 2;\n    }\n\n    .risk-chain .chain span:nth-of-type(8) {\n      grid-column: 8 / span 2;\n    }\n\n    .risk-chain .chain span:nth-of-type(9) {\n      grid-column: 10 / span 2;\n    }'''
          new = '''    /* HESMK — THREE-LEVEL RISK-TO-RESILIENCE FLOW */\n    .risk-chain .chain {\n      display: grid;\n      grid-template-columns: repeat(12, minmax(0, 1fr));\n      grid-template-rows: auto auto auto;\n      column-gap: 7px;\n      row-gap: 13px;\n      align-items: center;\n    }\n\n    .risk-chain .chain span {\n      text-align: center;\n      white-space: normal;\n      min-height: 42px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: 9px 7px;\n      line-height: 1.15;\n    }\n\n    .risk-chain .chain b {\n      color: var(--accent-light);\n      text-align: center;\n      font-size: .9rem;\n    }\n\n    /* Row 1: Context → Assets → Threats → Vulnerabilities */\n    .risk-chain .chain span:nth-child(1) { grid-column: 1 / span 2; grid-row: 1; }\n    .risk-chain .chain b:nth-child(2) { grid-column: 3; grid-row: 1; }\n    .risk-chain .chain span:nth-child(3) { grid-column: 4 / span 2; grid-row: 1; }\n    .risk-chain .chain b:nth-child(4) { grid-column: 6; grid-row: 1; }\n    .risk-chain .chain span:nth-child(5) { grid-column: 7 / span 2; grid-row: 1; }\n    .risk-chain .chain b:nth-child(6) { grid-column: 9; grid-row: 1; }\n    .risk-chain .chain span:nth-child(7) { grid-column: 10 / span 3; grid-row: 1; }\n\n    /* Row 2: Consequences → Risk → Controls */\n    .risk-chain .chain span:nth-child(9) { grid-column: 1 / span 3; grid-row: 2; }\n    .risk-chain .chain b:nth-child(10) { grid-column: 4; grid-row: 2; }\n    .risk-chain .chain span:nth-child(11) { grid-column: 5 / span 2; grid-row: 2; }\n    .risk-chain .chain b:nth-child(12) { grid-column: 7; grid-row: 2; }\n    .risk-chain .chain span:nth-child(13) { grid-column: 8 / span 3; grid-row: 2; }\n\n    /* Row 3: Cost → Resilience */\n    .risk-chain .chain span:nth-child(15) { grid-column: 5 / span 2; grid-row: 3; }\n    .risk-chain .chain b:nth-child(16) { grid-column: 7; grid-row: 3; }\n    .risk-chain .chain span:nth-child(17) { grid-column: 8 / span 3; grid-row: 3; }'''
          if old not in s:
              raise SystemExit('Expected risk-chain CSS not found')
          s = s.replace(old, new, 1)
          oldm = '''      .risk-chain .chain { grid-template-columns: repeat(2, 1fr); }\n      .risk-chain .chain span:nth-of-type(n) { grid-column: auto; }'''
          newm = '''      .risk-chain .chain {\n        display: flex;\n        flex-direction: column;\n        gap: 8px;\n        align-items: stretch;\n      }\n      .risk-chain .chain span,\n      .risk-chain .chain b {\n        grid-column: auto !important;\n        grid-row: auto !important;\n      }\n      .risk-chain .chain span { width: 100%; }\n      .risk-chain .chain b { transform: rotate(90deg); height: 8px; line-height: 8px; }'''
          if oldm not in s:
              raise SystemExit('Expected mobile risk-chain CSS not found')
          s = s.replace(oldm, newm, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-option1-flow.yml
          git commit -m 'Redesign risk chain as three-level flow'
          git push
