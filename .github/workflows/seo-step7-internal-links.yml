name: SEO Step 7 - Internal Links

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/seo-step7-internal-links.yml'

permissions:
  contents: write

jobs:
  internal-links:
    if: ${{ !contains(github.event.head_commit.message, 'SEO Step 7: add internal service links') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add capability internal links
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          links = {
              'Protective Security': 'physical-protective-security.html',
              'Threat &amp; Counter-Terrorism Advisory': 'counter-terrorism-threat-management.html',
              'Physical Security': 'physical-protective-security.html',
              'Crisis &amp; Emergency Management': 'organizational-resilience-business-continuity.html',
              'Business Continuity &amp; Resilience': 'organizational-resilience-business-continuity.html',
              'Security Governance &amp; Risk Advisory': 'security-governance-risk-advisory.html',
          }

          style = ' style="color:inherit;text-decoration:underline;text-decoration-color:rgba(184,148,85,.55);text-underline-offset:3px"'

          for label, url in links.items():
              plain = label.replace('&amp;', '&')
              old = f'<div class="cap-cell capability">{label}</div>'
              if old not in s:
                  old = f'<div class="cap-cell capability">{plain}</div>'
              if old in s:
                  new = f'<div class="cap-cell capability"><a href="{url}"{style}>{label}</a></div>'
                  s = s.replace(old, new, 1)
              elif f'<a href="{url}"' not in s:
                  raise SystemExit(f'Capability marker not found: {label}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "SEO Step 7: add internal service links"
          git push
