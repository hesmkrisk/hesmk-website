name: Apply Option 1 Credentials Layout

on: [push]

jobs:
  redesign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Option 1 layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          marker = '/* OPTION 1 EXECUTIVE CREDENTIAL STRIP */'
          if marker in h:
              raise SystemExit(0)
          css = r'''\n/* OPTION 1 EXECUTIVE CREDENTIAL STRIP */\n.credentials-section{padding:46px 0 18px;}\n.credentials-section .credentials-top{grid-template-columns:1.18fr 1.25fr .72fr;gap:34px;margin-top:8px;margin-bottom:10px;align-items:start;}\n.credentials-section .credentials-headline h2{font-size:clamp(2.25rem,3.65vw,3.25rem);line-height:1.03;letter-spacing:-.035em;margin:2px 0 18px;}\n.credentials-section .credentials-headline p{max-width:385px;font-size:.94rem;line-height:1.5;}\n.credentials-section .credentials-profile{padding-left:40px;min-height:135px;}\n.credentials-section .credentials-profile h3{font-size:clamp(2.45rem,3.5vw,3.25rem);}\n.credentials-section .profile-role{font-size:.73rem;letter-spacing:.21em;margin-top:8px;}\n.credentials-section .gold-rule.small{margin:11px 0 14px;}\n.credentials-section .profile-former{font-size:1.15rem;}\n.credentials-section .credentials-quote p{font-size:1.25rem;line-height:1.25;margin-top:8px;}\n.credentials-section .quote-mark{font-size:4.5rem;}\n.credentials-section .credentials-quote .gold-rule.small{margin-top:14px;}\n.credentials-section .credential-cards{grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0 0;}\n.credentials-section .credential-card{min-height:258px;height:258px;padding:10px 11px 12px;border-radius:9px;}\n.credentials-section .credential-mark{height:82px;min-height:82px;margin-bottom:8px;padding:6px 6px;border-radius:8px;}\n.credentials-section .credential-mark img{width:78px;height:78px;max-width:88px;max-height:78px;}\n.credentials-section .credential-mark strong{font-size:1.72rem;}\n.credentials-section .cpp-mark strong{font-size:2.05rem;}\n.credentials-section .csmp-mark{padding-left:12px;gap:2px;}\n.credentials-section .csmp-mark strong:nth-of-type(2){font-size:1.8rem;}\n.credentials-section .csmp-mark small{font-size:.5rem;margin-top:4px;}\n.credentials-section .asis-mark strong{font-size:2rem;}\n.credentials-section .ismi-mark strong{font-size:1.42rem;}\n.credentials-section .credential-card h4{font-size:.88rem;line-height:1.12;min-height:38px;margin:5px 0 0;}\n.credentials-section .credential-card .gold-rule.tiny{width:34px;margin:7px auto 9px;}\n.credentials-section .credential-card p{font-size:.7rem;line-height:1.35;text-align:left;}\n@media(max-width:1000px){.credentials-section .credentials-top{grid-template-columns:1fr 1fr}.credentials-section .credential-cards{margin-left:0;grid-template-columns:repeat(3,1fr);}.credentials-section .credential-card{height:auto;min-height:250px;}}\n@media(max-width:700px){.credentials-section{padding-top:40px}.credentials-section .credentials-top{grid-template-columns:1fr;gap:20px}.credentials-section .credentials-headline h2{font-size:2.7rem}.credentials-section .credential-cards{grid-template-columns:1fr 1fr;}.credentials-section .credential-card{min-height:250px;}}\n'''
          h = h.replace('</style>', css + '</style>', 1)
          p.write_text(h, encoding='utf-8')
          print('Option 1 executive credential strip applied.')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine credentials into executive credential strip"
          git push
          git rm .github/workflows/option1-credentials.yml
          git commit -m "Remove temporary layout workflow"
          git push
