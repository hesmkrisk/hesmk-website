name: Fix Credential Layout
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
<style id="fix-credential-layout">
/* Keep the credential strip entirely to the right of the left narrative */
.credentials-section .credential-cards{
  width:calc(100% - 620px) !important;
  margin-left:620px !important;
  margin-right:0 !important;
  margin-top:12px !important;
  gap:8px !important;
  position:relative !important;
  z-index:4 !important;
}
.credentials-section .credential-card{
  height:202px !important;
  min-height:202px !important;
  padding:7px 7px 8px !important;
  border-radius:8px !important;
}
.credentials-section .credential-mark{
  height:52px !important;
  min-height:52px !important;
  margin-bottom:4px !important;
  padding:2px !important;
  border-radius:7px !important;
}
.credentials-section .credential-mark img{
  width:42px !important;
  height:42px !important;
  max-width:44px !important;
  max-height:42px !important;
}
.credentials-section .credential-mark strong{font-size:1.12rem !important}
.credentials-section .cpp-mark strong{font-size:1.36rem !important}
.credentials-section .csmp-mark strong{font-size:1.27rem !important}
.credentials-section .asis-mark strong{font-size:1.32rem !important}
.credentials-section .ismi-mark strong{font-size:.88rem !important}
.credentials-section .credential-card h4{font-size:.67rem !important;line-height:1.05 !important;min-height:28px !important;margin:2px 0 0 !important}
.credentials-section .credential-card .gold-rule.tiny{width:20px !important;margin:3px auto 4px !important}
.credentials-section .credential-card p{font-size:.54rem !important;line-height:1.18 !important;margin:0 !important}
@media(max-width:1100px){
  .credentials-section .credential-cards{width:100% !important;margin-left:0 !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important}
  .credentials-section .credential-card{height:auto !important;min-height:200px !important}
}
@media(max-width:700px){
  .credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important}
  .credentials-section .credential-card{min-height:198px !important}
}
</style>
'''
          if 'id="fix-credential-layout"' not in s:
              s=s.replace('</style>',css+'</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep credential cards separate from left narrative"
          git push
          git rm .github/workflows/fix-credential-layout.yml
          git commit -m "Remove temporary credential layout workflow"
          git push
