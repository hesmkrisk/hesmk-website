name: Fix HESMK Credentials Section

on: [push]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep one final credentials section
        shell: bash
        run: |
          git show 0d5728b057eb4ddb55fe2e79a25a2ff8442f1c0c:index.html > /tmp/reference.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          current = Path('index.html').read_text(encoding='utf-8')
          reference = Path('/tmp/reference.html').read_text(encoding='utf-8')
          start = reference.rfind('<section class="section credentials-section" id="credentials">')
          end = reference.find('</section>', start)
          if start < 0 or end < 0:
              raise SystemExit('Final reference section not found')
          final_section = reference[start:end+10]
          pattern = r'\s*<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->\s*<section[^>]+id=["\']credentials(?:-reference-design)?["\'][^>]*>.*?</section>\s*'
          current = re.sub(pattern, '\n', current, flags=re.S)
          sector = re.search(r'<section[^>]+class=["\']section sectors["\'][^>]+id=["\']sectors["\'][^>]*>', current, re.I)
          if not sector:
              raise SystemExit('Actual sectors section not found')
          current = current[:sector.start()] + '\n<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->\n' + final_section + '\n\n  ' + current[sector.start():]
          Path('index.html').write_text(current, encoding='utf-8')
          print('Credentials section normalized to one final reference version.')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize credentials reference section"
          git push
