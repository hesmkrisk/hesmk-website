name: Final Credential Minor Adjustments

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  adjust-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested credential refinements
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<style id="FINAL-CREDENTIAL-MINOR-ADJUSTMENTS">'

          css = r'''<style id="FINAL-CREDENTIAL-MINOR-ADJUSTMENTS">
          /* Final credential refinements: center CSMP and place ISMI gold rule below membership title */
          .credentials-section .csmp-mark{
            display:flex !important;
            flex-direction:column !important;
            align-items:center !important;
            justify-content:center !important;
            text-align:center !important;
            padding-left:0 !important;
            padding-right:0 !important;
          }
          .credentials-section .csmp-mark strong:nth-of-type(2){
            display:block !important;
            position:relative !important;
            left:0 !important;
            margin-left:auto !important;
            margin-right:auto !important;
          }
          .credentials-section .ismi-mark .gold-bar{display:none !important;}
          .credentials-section .ismi-mark + h4 + .gold-rule.tiny{
            display:block !important;
            width:24px !important;
            height:2px !important;
            margin:4px auto 6px !important;
          }
          </style>'''

          if marker in html:
              raise SystemExit('Final credential minor adjustments already present; no change required.')

          html = html.replace('</head>', css + '\n</head>', 1)
          old = '<span class="gold-bar"></span>'
          if old in html:
              html = html.replace(old, '', 1)
          else:
              raise SystemExit('Expected ISMI gold-bar markup not found; no change made.')

          path.write_text(html, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Center CSMP and move ISMI gold bar"
          git push
