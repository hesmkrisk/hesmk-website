name: Tighten HESMK Credentials

on: [push]

jobs:
  tighten:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adjust credentials layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          marker='/* FINAL CREDENTIALS SPACING — BALANCED REFERENCE */'
          if marker in h:
              raise SystemExit(0)
          css=r'''
          /* FINAL CREDENTIALS SPACING — BALANCED REFERENCE */
          .credentials-section .credential-cards{
            margin-top:-268px !important;
            gap:10px !important;
            position:relative !important;
            z-index:2 !important;
          }
          .credentials-section .credential-card{
            min-height:318px !important;
            height:318px !important;
            padding:12px 14px 16px !important;
          }
          .credentials-section .credential-mark{
            height:88px !important;
            min-height:88px !important;
            margin-bottom:9px !important;
            padding:7px 8px !important;
          }
          .credentials-section .credential-mark img{
            width:auto !important;
            height:68px !important;
            max-width:92px !important;
            object-fit:contain !important;
          }
          .credentials-section .credential-mark strong{font-size:1.72rem !important;}
          .credentials-section .cpp-mark strong{font-size:2.05rem !important;}
          .credentials-section .csmp-mark strong:nth-of-type(2){font-size:1.78rem !important;}
          .credentials-section .csmp-mark small{font-size:.52rem !important;margin-top:4px !important;}
          .credentials-section .asis-mark strong{font-size:2.05rem !important;}
          .credentials-section .ismi-mark strong{font-size:1.48rem !important;}
          .credentials-section .credential-card h4{
            font-size:.94rem !important;
            line-height:1.12 !important;
            min-height:44px !important;
            margin:4px 0 0 !important;
          }
          .credentials-section .credential-card .gold-rule.tiny{
            width:42px !important;
            height:2px !important;
            margin:6px auto 10px !important;
          }
          .credentials-section .credential-card p{
            font-size:.75rem !important;
            line-height:1.42 !important;
          }
          @media(max-width:1000px){
            .credentials-section .credential-cards{margin-top:0 !important;}
          }
          @media(max-width:700px){
            .credentials-section .credential-cards{margin-top:0 !important;}
            .credentials-section .credential-mark{height:88px !important;min-height:88px !important;}
          }
          '''
          h=h.replace('</style>',css+'\n</style>',1)
          p.write_text(h,encoding='utf-8')
          print('Credentials section tightened for balanced symmetry.')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Balance credential card spacing and monogram scale"
          git rm .github/workflows/tighten-credentials.yml
          git commit -m "Remove temporary credentials workflow"
          git push
