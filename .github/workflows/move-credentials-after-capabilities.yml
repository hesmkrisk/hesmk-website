name: Move Credentials After Capabilities

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reorder-sections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move credentials section after capabilities
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          cred_start = '<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->'
          cred_end = '<!-- SECTORS -->'
          cap_start = '<!-- CAPABILITIES -->'
          cap_end = '<!-- CONTACT -->'

          if not all(marker in html for marker in (cred_start, cred_end, cap_start, cap_end)):
              raise SystemExit('Required section markers not found.')

          cred_pos = html.index(cred_start)
          sectors_pos = html.index(cred_end)
          cap_pos = html.index(cap_start)
          contact_pos = html.index(cap_end)

          if cap_pos > cred_pos:
              credential_block = html[cred_pos:sectors_pos]
              html_without_credentials = html[:cred_pos] + html[sectors_pos:]

              cap_pos_new = html_without_credentials.index(cap_start)
              contact_pos_new = html_without_credentials.index(cap_end)

              insert_at = contact_pos_new
              html_without_credentials = (
                  html_without_credentials[:insert_at]
                  + '\n\n'
                  + credential_block.strip()
                  + '\n\n'
                  + html_without_credentials[insert_at:]
              )
              path.write_text(html_without_credentials, encoding='utf-8')
          else:
              print('Credentials section is already after capabilities; no change required.')

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Move leadership credentials after capabilities"
          git push
