name: Apply HESMK Classic Authority Logo

on:
  push:
    paths:
      - '.github/workflows/apply-classic-logo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install selected logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span class="brand-wordmark">HESMK</span><span class="brand-submark">INTEGRATED SOLUTIONS</span>'
          new = '<img class="brand-logo" src="assets/hesmk-classic-authority.png" alt="HESMK Integrated Solutions">'
          if old in s:
              s = s.replace(old, new, 1)
          old_css = '''    .brand {\n      display: inline-flex;\n      flex-direction: column;\n      align-items: flex-start;\n      justify-content: center;\n      gap: 4px;\n      color: var(--navy);\n      font-weight: 900;\n      letter-spacing: .04em;\n      width: 210px;\n    }'''
          new_css = '''    .brand {\n      display: flex;\n      align-items: center;\n      justify-content: flex-start;\n      width: 245px;\n    }\n\n    .brand-logo {\n      width: 225px;\n      height: auto;\n      max-height: 68px;\n      object-fit: contain;\n      object-position: left center;\n      display: block;\n    }'''
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          import re
          s = re.sub(r'\n    \.brand-wordmark \{.*?\n    \}\n\n    \.brand-submark \{.*?\n    \}', '', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'assets/hesmk-classic-authority.png' in s
          assert '<img class="brand-logo"' in s
          print('Logo reference validated')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use HESMK Classic Authority logo' || true
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-classic-logo.yml
          git commit -m 'Remove temporary logo workflow'
          git push
