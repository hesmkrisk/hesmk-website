name: Fix HESMK Credentials Layout

on:
  workflow_dispatch:

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore approved credentials layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          section = r'''<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->
          <section class="section credentials-section" id="credentials">
            <div class="container credentials-wrap">
              <div class="credentials-top">
                <div class="credentials-eyebrow eyebrow">Leadership &amp; Professional Credentials</div>
              </div>

              <div class="credentials-header">
                <div class="credentials-heading">
                  <h2>Experience.<br>Certification.<br>Global Perspective.</h2>
                </div>

                <div class="credentials-profile">
                  <h3>Khalid Habib</h3>
                  <div class="credentials-role">Security &amp; Risk Professional</div>
                  <div class="credentials-profile-rule"></div>
                  <div class="credentials-former">Former SSG Officer</div>
                </div>

                <div class="credentials-quote">
                  <div class="quote-mark">“</div>
                  <p>Turning security<br>challenges into<br>resilient opportunities.</p>
                  <div class="credentials-profile-rule"></div>
                </div>
              </div>

              <div class="credentials-body">
                <div class="credentials-copy">
                  <div class="credential-rule"></div>
                  <p>HESMK is led by a security and risk professional with operational experience in hostile environments and internationally recognized professional credentials, combining real-world insight with global best practices.</p>
                </div>

                <div class="credential-cards">
                  <article class="credential-card">
                    <div class="credential-mark ssg"><img src="ssg.png" alt="SSG insignia"></div>
                    <h4>Former SSG Officer</h4>
                    <div class="credential-rule"></div>
                    <p>Operational experience in hostile environments and counter-terrorism operations.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark">CPP<small>ASIS INTERNATIONAL</small></div>
                    <h4>Certified Protection Professional (CPP)</h4>
                    <div class="credential-rule"></div>
                    <p>Professional protection credential issued by ASIS International.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark csmp">ISMI · CSMP<small>LEVEL 6</small></div>
                    <h4>Certified Security Management Professional Level 6</h4>
                    <div class="credential-rule"></div>
                    <p>Security management qualification associated with ISMI.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark">ASIS<small>INTERNATIONAL</small></div>
                    <h4>Professional Member</h4>
                    <div class="credential-rule"></div>
                    <p>Member of ASIS International and its global professional security community.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark">ISMI<small>UK</small></div>
                    <h4>Professional Member</h4>
                    <div class="credential-rule"></div>
                    <p>Member of the International Security Management Institute, UK.</p>
                  </article>
                </div>
              </div>
            </div>
          </section>
          '''

          # Replace the existing credentials section, preserving everything else.
          pattern = r'\s*<!-- LEADERSHIP &amp; PROFESSIONAL CREDENTIALS -->\s*<section class="section credentials-section" id="credentials">.*?</section>\s*'
          new_html, count = re.subn(pattern, '\n\n' + section + '\n', html, count=1, flags=re.S)
          if count != 1:
              pattern2 = r'\s*<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->\s*<section class="section credentials-section" id="credentials">.*?</section>\s*'
              new_html, count = re.subn(pattern2, '\n\n' + section + '\n', html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate existing credentials section')
          html = new_html

          css = r'''
          /* FINAL CREDENTIALS LAYOUT — aligned to approved corporate mockup */
          .credentials-section{background:var(--white);padding:58px 0 54px;}
          .credentials-wrap{width:min(92%,var(--max));margin:auto;}
          .credentials-top{height:0;position:relative;}
          .credentials-eyebrow{position:absolute;top:0;left:0;z-index:2;}
          .credentials-header{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.45fr) minmax(220px,.75fr);gap:42px;align-items:start;padding-top:28px;}
          .credentials-heading{padding-top:18px;padding-right:34px;border-right:1px solid rgba(8,24,39,.18);}
          .credentials-heading h2{font-family:Georgia,serif;color:var(--navy);font-size:clamp(3rem,4.8vw,4.35rem);line-height:1.02;letter-spacing:-.035em;margin:0;}
          .credentials-profile{padding-top:12px;}
          .credentials-profile h3{font-family:Georgia,serif;color:var(--navy);font-size:clamp(2.7rem,4vw,4rem);line-height:1;margin:0 0 8px;letter-spacing:-.035em;}
          .credentials-role{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-size:.82rem;font-weight:700;}
          .credentials-profile-rule{width:42px;height:2px;background:var(--accent);margin:16px 0 14px;}
          .credentials-former{font-family:Georgia,serif;color:var(--navy);font-size:1.18rem;}
          .credentials-quote{padding-top:8px;padding-left:10px;color:#2f4b66;}
          .credentials-quote .quote-mark{font-family:Georgia,serif;color:var(--accent);font-size:5.2rem;line-height:.45;margin:0 0 18px;}
          .credentials-quote p{font-family:Georgia,serif;font-style:italic;font-size:1.2rem;line-height:1.4;margin:0;}
          .credentials-quote .credentials-profile-rule{margin-top:18px;}
          .credentials-body{display:grid;grid-template-columns:minmax(270px,.9fr) minmax(0,2.1fr);gap:36px;align-items:start;margin-top:22px;}
          .credentials-copy{padding-right:12px;}
          .credentials-copy .credential-rule{margin:0 0 18px 0;}
          .credentials-copy p{max-width:405px;color:#2f5775;font-size:1rem;line-height:1.58;margin:0;}
          .credential-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch;}
          .credential-card{min-height:318px;height:318px;padding:18px 14px 17px;background:#fff;border:1px solid rgba(8,24,39,.12);border-radius:12px;box-shadow:0 10px 26px rgba(8,24,39,.055);display:flex;flex-direction:column;text-align:left;overflow:hidden;}
          .credential-mark{width:100%;height:102px;flex:0 0 102px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;color:var(--navy);font-family:Georgia,serif;font-weight:800;}
          .credential-mark.ssg img{width:78px;height:92px;object-fit:contain;}
          .credential-mark.wordmark{border:1px solid rgba(184,148,85,.22);background:#faf8f3;border-radius:8px;font-size:1.42rem;letter-spacing:.04em;text-align:center;line-height:1.1;flex-direction:column;}
          .credential-mark.wordmark small{display:block;font-family:Inter,ui-sans-serif,sans-serif;font-size:.54rem;letter-spacing:.1em;margin-top:8px;color:#607080;font-weight:700;}
          .credential-mark.csmp{font-size:1.28rem;}
          .credential-card h4{font-family:Georgia,serif;color:var(--navy);font-size:.92rem;line-height:1.2;text-align:center;margin:0 0 7px;min-height:44px;display:flex;align-items:center;justify-content:center;}
          .credential-card .credential-rule{width:42px;height:2px;background:var(--accent);margin:5px auto 12px;flex:0 0 auto;}
          .credential-card p{font-size:.77rem;color:#607080;line-height:1.5;text-align:left;margin:0;}
          .credentials-attribution{display:none!important;}

          @media(max-width:1050px){
            .credentials-header{grid-template-columns:1fr 1.35fr;gap:28px;}
            .credentials-quote{grid-column:1 / -1;padding-left:0;padding-top:0;display:flex;align-items:flex-start;gap:14px;}
            .credentials-quote .quote-mark{margin:0;}
            .credentials-quote p{padding-top:6px;}
            .credentials-body{grid-template-columns:1fr;gap:24px;}
            .credentials-copy p{max-width:720px;}
            .credential-cards{grid-template-columns:repeat(3,minmax(0,1fr));}
          }
          @media(max-width:700px){
            .credentials-section{padding:52px 0 44px;}
            .credentials-top{height:auto;}
            .credentials-eyebrow{position:static;margin-bottom:18px;}
            .credentials-header{grid-template-columns:1fr;gap:18px;padding-top:0;}
            .credentials-heading{border-right:0;border-bottom:1px solid rgba(8,24,39,.15);padding:0 0 22px;}
            .credentials-heading h2{font-size:2.75rem;}
            .credentials-profile{padding-top:0;}
            .credentials-profile h3{font-size:2.8rem;}
            .credentials-quote{grid-column:auto;}
            .credentials-body{margin-top:26px;}
            .credential-cards{grid-template-columns:1fr 1fr;}
          }
          @media(max-width:440px){
            .credential-cards{grid-template-columns:1fr;}
            .credential-card{height:auto;min-height:280px;}
          }
          '''

          style_pos = html.rfind('</style>')
          if style_pos == -1:
              raise SystemExit('Could not find closing style tag')
          html = html[:style_pos] + '\n' + css + '\n' + html[style_pos:]
          path.write_text(html,encoding='utf-8')
          print('Credentials section realigned to approved mockup and supplied SSG insignia is used.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Realign leadership credentials section"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-credentials-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-credentials-layout.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary credentials layout workflow"
          git push
