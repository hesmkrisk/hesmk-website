name: Fix HESMK credentials layout

on:
  push:
    paths:
      - '.github/workflows/fix-credentials-layout.yml'
  workflow_dispatch:

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine credentials section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          /* CREDENTIALS — FINAL CORPORATE ALIGNMENT */
          .credentials-section{background:var(--white);padding:72px 0 68px;}
          .credentials-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:54px;align-items:start;}
          .credentials-lead{padding-top:2px;}
          .credentials-lead h2{font-family:Georgia,serif;font-size:clamp(2.45rem,3.7vw,4rem);line-height:1.03;margin:4px 0 22px;max-width:500px;}
          .credentials-lead p{max-width:430px;font-size:.98rem;line-height:1.72;color:#46647d;margin:0;}
          .credentials-name{border-left:1px solid rgba(8,24,39,.16);padding:2px 0 22px 42px;margin:0 0 24px;}
          .credentials-name h3{font-family:Georgia,serif!important;color:var(--navy)!important;font-size:clamp(2.05rem,3.1vw,3rem)!important;line-height:1.08!important;margin:0 0 5px!important;visibility:visible!important;}
          .credentials-role{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-size:.8rem;font-weight:700;}
          .credentials-former{margin-top:13px;font-family:Georgia,serif;color:var(--navy);font-size:1.05rem;}
          .credential-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:stretch;}
          .credential-card{min-height:326px;padding:16px 14px 18px;background:#fff;border:1px solid rgba(8,24,39,.11);border-radius:12px;box-shadow:0 10px 26px rgba(8,24,39,.055);display:flex;flex-direction:column;align-items:stretch;text-align:left;}
          .credential-mark{width:100%;height:104px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden;color:var(--navy);font-family:Georgia,serif;font-weight:800;}
          .credential-mark.ssg{background:#fff;}
          .credential-mark.ssg img{width:82px!important;height:94px!important;max-width:none;object-fit:contain;}
          .credential-mark.wordmark{border:1px solid rgba(184,148,85,.2);background:#faf8f3;border-radius:8px;font-size:1.38rem;letter-spacing:.04em;text-align:center;flex-direction:column;gap:0;}
          .credential-mark.wordmark small{display:block;font-family:Inter,ui-sans-serif,sans-serif;font-size:.53rem;letter-spacing:.08em;margin-top:6px;color:#607080;font-weight:700;}
          .credential-card h4{font-family:Georgia,serif;color:var(--navy);font-size:.93rem;line-height:1.2;text-align:center;margin:0 0 8px;min-height:52px;display:flex;align-items:flex-start;justify-content:center;}
          .credential-card .credential-rule{width:42px;height:2px;background:var(--accent);margin:0 auto 12px;flex:0 0 auto;}
          .credential-card p{font-size:.78rem;color:#607080;line-height:1.5;text-align:left;margin:0;}
          .credentials-attribution{display:none!important;}
          .resilience-cta{background:var(--navy)!important;}
          footer{background:var(--navy)!important;}
          @media(max-width:1050px){.credentials-grid{grid-template-columns:1fr;gap:30px}.credentials-name{border-left:0;border-top:1px solid rgba(8,24,39,.16);padding:22px 0 20px}.credential-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.credentials-lead p{max-width:760px}.credentials-lead h2{max-width:760px}}
          @media(max-width:650px){.credentials-section{padding:56px 0}.credential-cards{grid-template-columns:1fr 1fr;gap:10px}.credential-card{min-height:280px;padding:14px 12px}.credential-mark{height:92px}.credential-mark.ssg img{width:72px!important;height:82px!important}.credential-card h4{font-size:.86rem;min-height:46px}.credential-card p{font-size:.74rem}.credentials-name h3{font-size:2.3rem!important}.credentials-role{font-size:.7rem}}
          @media(max-width:430px){.credential-cards{grid-template-columns:1fr}.credential-card{min-height:auto}}
          '''

          marker='/* CREDENTIALS — FINAL CORPORATE ALIGNMENT */'
          if marker not in html:
              pos=html.rfind('</style>')
              if pos==-1: raise SystemExit('Closing style tag not found')
              html=html[:pos]+'\n'+css+'\n'+html[pos:]

          html=re.sub(r'\s*<p class="credentials-attribution">.*?</p>','',html,flags=re.S)
          path.write_text(html,encoding='utf-8')
          print('Final corporate credentials alignment applied.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine credentials section alignment"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-credentials-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-credentials-layout.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary credentials layout workflow"
          git push
