name: Repair Credential Layout

on: [push]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply layout CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          marker = 'CREDENTIAL LAYOUT REPAIR 2026-09-11'
          if marker in h:
              raise SystemExit(0)
          css = r'''\n/* CREDENTIAL LAYOUT REPAIR 2026-09-11 */\n.credentials-section .credential-cards{\n  display:grid !important;\n  grid-template-columns:repeat(5,minmax(0,1fr)) !important;\n  gap:8px !important;\n  width:calc(100% - 610px) !important;\n  margin-left:610px !important;\n  margin-right:0 !important;\n  margin-top:8px !important;\n  position:relative !important;\n  z-index:4 !important;\n}\n.credentials-section .credential-card{\n  height:196px !important;\n  min-height:196px !important;\n  padding:6px 7px 8px !important;\n  border-radius:8px !important;\n  overflow:hidden !important;\n}\n.credentials-section .credential-mark{\n  height:48px !important;\n  min-height:48px !important;\n  margin-bottom:4px !important;\n  padding:2px !important;\n  border-radius:6px !important;\n}\n.credentials-section .credential-mark img{\n  width:36px !important;\n  height:36px !important;\n  max-width:38px !important;\n  max-height:36px !important;\n}\n.credentials-section .credential-mark strong{font-size:1.02rem !important;line-height:1 !important;}\n.credentials-section .cpp-mark strong{font-size:1.25rem !important;}\n.credentials-section .csmp-mark strong{font-size:1.16rem !important;}\n.credentials-section .asis-mark strong{font-size:1.22rem !important;}\n.credentials-section .ismi-mark strong{font-size:.82rem !important;}\n.credentials-section .csmp-mark small{font-size:.42rem !important;letter-spacing:.13em !important;margin-top:2px !important;}\n.credentials-section .credential-card h4{font-size:.64rem !important;line-height:1.04 !important;min-height:27px !important;margin:2px 0 0 !important;}\n.credentials-section .credential-card .gold-rule.tiny{width:18px !important;margin:3px auto 4px !important;}\n.credentials-section .credential-card p{font-size:.52rem !important;line-height:1.16 !important;margin:0 !important;}\n@media(max-width:1100px){\n  .credentials-section .credential-cards{width:100% !important;margin-left:0 !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;}\n  .credentials-section .credential-card{height:auto !important;min-height:195px !important;}\n}\n@media(max-width:700px){\n  .credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important;}\n  .credentials-section .credential-card{min-height:192px !important;}\n}\n'''
          h = h.replace('</style>', css + '</style>', 1)
          p.write_text(h, encoding='utf-8')
          print('Credential layout repair CSS applied.')
          PY
      - name: Commit update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair credential layout separation"
          git push
          git rm .github/workflows/credential-layout-repair.yml
          git commit -m "Remove temporary credential repair workflow"
          git push
