name: Remove Services Section
on:
  push:
    paths:
      - '.github/workflows/remove-services.yml'

jobs:
  remove-services:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove Services/Capabilities section and nav link
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the homepage Services / Capabilities section.
          before = s
          s = re.sub(r'\s*<!--\s*SERVICES\s*-->.*?(?=\s*<!--\s*SECTORS\s*-->)', '\n', s, count=1, flags=re.I|re.S)
          if s == before:
              raise SystemExit('Services section marker not found')

          # Remove the Services navigation link.
          s = re.sub(r'\s*<a href="#services"[^>]*>Services</a>', '', s, count=1, flags=re.I)

          # Remove the hero Explore Our Services button if present, since the destination is gone.
          s = re.sub(r'\s*<a class="btn btn-outline" href="#services">Explore Our Services</a>', '', s, count=1, flags=re.I)

          p.write_text(s, encoding='utf-8')

          if re.search(r'<!--\s*SERVICES\s*-->', s, re.I):
              raise SystemExit('Services marker still present')
          if re.search(r'href="#services"', s, re.I):
              raise SystemExit('A #services link still remains')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Remove Services section from homepage"
          git push

      - name: Remove this temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/remove-services.yml
          git commit -m "Remove temporary services workflow"
          git push
