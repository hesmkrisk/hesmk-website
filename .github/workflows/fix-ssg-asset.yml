name: Fix SSG Insignia Asset

on:
  push:
    branches: [main]

jobs:
  fix-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download supplied matching SSG vector
        run: |
          set -e
          curl -L --fail --silent --show-error -A "Mozilla/5.0" \
            -o ssg-insignia.svg \
            'https://upload.wikimedia.org/wikipedia/commons/1/1b/Insignia_of_Pakistan_Army_Special_Service_Group_%28SSG%29.svg'
          grep -q '<svg' ssg-insignia.svg
          test "$(wc -c < ssg-insignia.svg)" -gt 10000
          echo "SSG SVG validated: $(wc -c < ssg-insignia.svg) bytes"
      - name: Commit corrected asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ssg-insignia.svg
          git diff --cached --quiet && exit 0
          git commit -m "Fix SSG insignia asset"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-ssg-asset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-ssg-asset.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary SSG asset workflow"
          git push
