name: SEO Step 4A

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-on-page-seo:
    if: ${{ !contains(github.event.head_commit.message, 'SEO Step 4A') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply controlled on-page SEO improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<h2>Security Should Be Designed Around Risk — Not Assumptions</h2>',
                  '<h2>Security Risk Management — Not Assumptions</h2>',
              ),
              (
                  '<h2>Security Solutions Designed Around Your Risk</h2>',
                  '<h2>Risk-Based Security Solutions Across Key Sectors</h2>',
              ),
              (
                  '<h2>HESMK Capabilities</h2>',
                  '<h2>Security Risk Management &amp; Protective Security Capabilities</h2>',
              ),
              (
                  '<p class="capabilities-subtitle">From Security Risk to Organizational Resilience</p>',
                  '<p class="capabilities-subtitle">Security Risk Assessment, Protective Security &amp; Organizational Resilience</p>',
              ),
              (
                  '<p class="capabilities-intro">We help organizations understand their security risks, design proportionate solutions and build long-term resilience.</p>',
                  '<p class="capabilities-intro">We help organizations assess security risk, strengthen protective security and build organizational resilience through proportionate, practical solutions.</p>',
              ),
              (
                  '<h2>Let\'s Discuss Your Security Risk</h2>',
                  '<h2>Discuss Your Security Risk</h2>',
              ),
              (
                  'Request a Security Consultation →',
                  'Request a Security Risk Consultation →',
              ),
              (
                  '>Request Consultation →<',
                  '>Request Security Consultation →<',
              ),
          ]

          for old, new in replacements:
              count = html.count(old)
              if count:
                  html = html.replace(old, new)
                  print(f'Updated {count}: {old}')
              else:
                  print(f'Not found (already changed or absent): {old}')

          # Keep the primary homepage H1 explicit and unchanged in meaning.
          h1_pattern = r'<h1>\s*Risk-Based Security for a\s*<span>Changing Pakistan</span>\s*</h1>'
          h1_replacement = '<h1>Risk-Based Security for a <span>Changing Pakistan</span></h1>'
          html, h1_count = re.subn(h1_pattern, h1_replacement, html, count=1)
          print(f'Normalized primary H1: {h1_count}')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit SEO Step 4A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "SEO Step 4A: improve homepage headings and search relevance"
          git push
