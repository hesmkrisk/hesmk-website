name: Apply HESMK Credentials Design

on: [push]

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace credentials section with final reference
        shell: bash
        run: |
          git show 0d5728b057eb4ddb55fe2e79a25a2ff8442f1c0c:index.html > /tmp/reference.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          current = Path('index.html').read_text(encoding='utf-8')
          reference = Path('/tmp/reference.html').read_text(encoding='utf-8')
          start_ref = reference.rfind('<section class="section credentials-section" id="credentials">')
          end_ref = reference.find('</section>', start_ref)
          if start_ref < 0 or end_ref < 0:
              raise SystemExit('Final reference credentials section not found')
          final_section = reference[start_ref:end_ref+10]
          pattern = r'<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->\s*<section[^>]+id=["\']credentials["\'][^>]*>.*?</section>\s*<!-- SECTORS -->'
          current, count = re.subn(pattern, '<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->\n' + final_section + '\n\n  <!-- SECTORS -->', current, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one existing credentials section, replaced {count}')
          Path('index.html').write_text(current, encoding='utf-8')
          print('Final reference credentials section applied.')
          PY
      - name: Commit site only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align credentials section with final reference"
          git push
