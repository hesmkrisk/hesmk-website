name: Apply HESMK Credentials Design

on: [push]

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract approved credentials design
        shell: bash
        run: |
          git show 0d5728b057eb4ddb55fe2e79a25a2ff8442f1c0c:index.html > /tmp/reference.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          current = Path('index.html').read_text(encoding='utf-8')
          reference = Path('/tmp/reference.html').read_text(encoding='utf-8')
          if 'id="credentials-reference-design"' in current:
              raise SystemExit(0)
          css_match = re.search(r'/\* FINAL APPROVED CREDENTIALS DESIGN \*/(.*?)\n</style>', reference, re.S)
          if not css_match:
              raise SystemExit('Approved credentials CSS not found')
          css = css_match.group(0).replace('</style>', '', 1)
          section_match = re.search(r'<!-- LEADERSHIP &amp; PROFESSIONAL CREDENTIALS -->(.*?)<!-- SECTORS -->', reference, re.S)
          if not section_match:
              raise SystemExit('Approved credentials HTML not found')
          section = section_match.group(1)
          section = '<section class="section credentials-reference" id="credentials-reference-design">' + section.split('<section class="section credentials-section" id="credentials">',1)[1].split('</section>',1)[0] + '</section>'
          section = section.replace('class="section credentials-section" id="credentials"','class="section credentials-reference" id="credentials-reference-design"')
          current = current.replace('</style>', css + '\n</style>', 1)
          sector = re.search(r'<section[^>]+id=["\']sectors["\'][^>]*>', current, re.I)
          if not sector:
              raise SystemExit('Sectors section not found')
          current = current[:sector.start()] + section + '\n\n' + current[sector.start():]
          tag_css = '\n.nav-tagline{display:flex;align-items:stretch;gap:20px;margin-left:auto;padding-left:28px;border-left:1px solid #173b67;color:#173b67;font-family:Georgia,"Times New Roman",serif;font-size:.68rem;font-weight:700;letter-spacing:.16em;line-height:1.35;text-transform:uppercase;text-align:left;}\n@media(max-width:1100px){.nav-tagline{display:none;}}\n'
          current = current.replace('</style>', tag_css + '</style>', 1)
          nav_end = current.find('</nav>')
          if nav_end < 0:
              raise SystemExit('Nav not found')
          current = current[:nav_end+6] + '\n    <div class="nav-tagline">PROTECTING ASSET<br>ENABLING STRATEGY<br>BUILDING RESILIENCE</div>' + current[nav_end+6:]
          Path('index.html').write_text(current, encoding='utf-8')
          print('Credentials design applied.')
          PY
      - name: Commit and restore workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout d9e028d34610a4203699c094a60a03fec14e9259 -- .github/workflows/add-capabilities.yml
          rm -f apply_credentials.b64
          git add index.html .github/workflows/add-capabilities.yml apply_credentials.b64
          git commit -m "Apply leadership credentials reference design"
          git push
