name: Refine credential boxes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/credential-box-refine.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reduce and reposition credential boxes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
<style id="credential-box-refinement">
/* Credential boxes — compact, clear separation from left narrative */
.credentials-section .credential-cards{width:calc(100% - 500px) !important;margin-left:500px !important;margin-right:0 !important;margin-top:2px !important;gap:9px !important;}
.credentials-section .credential-card{height:228px !important;min-height:228px !important;padding:8px 9px 9px !important;border-radius:8px !important;}
.credentials-section .credential-mark{height:64px !important;min-height:64px !important;margin-bottom:5px !important;padding:3px !important;border-radius:7px !important;}
.credentials-section .credential-mark img{width:54px !important;height:54px !important;max-width:58px !important;max-height:54px !important;}
.credentials-section .credential-mark strong{font-size:1.34rem !important;}
.credentials-section .cpp-mark strong{font-size:1.62rem !important;}
.credentials-section .csmp-mark strong{font-size:1.5rem !important;}
.credentials-section .csmp-mark small{font-size:.42rem !important;letter-spacing:.13em !important;margin-top:2px !important;}
.credentials-section .asis-mark strong{font-size:1.56rem !important;}
.credentials-section .ismi-mark strong{font-size:1.08rem !important;}
.credentials-section .credential-card h4{font-size:.76rem !important;line-height:1.1 !important;min-height:32px !important;margin:3px 0 0 !important;}
.credentials-section .credential-card .gold-rule.tiny{width:27px !important;margin:5px auto 6px !important;}
.credentials-section .credential-card p{font-size:.63rem !important;line-height:1.28 !important;margin:0 !important;}
@media(max-width:1100px){
  .credentials-section .credential-cards{width:100% !important;margin-left:0 !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;}
  .credentials-section .credential-card{height:auto !important;min-height:225px !important;}
}
@media(max-width:700px){
  .credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important;}
  .credentials-section .credential-card{min-height:220px !important;}
  .credentials-section .credential-mark{height:66px !important;min-height:66px !important;}
}
</style>
'''
          if 'id="credential-box-refinement"' not in s:
              s += '\n' + css + '\n'
              p.write_text(s, encoding='utf-8')
          else:
              print('CSS already present')
      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine credential box proportions" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/credential-box-refine.yml
          git commit -m "Remove temporary credential refinement workflow"
          git push
