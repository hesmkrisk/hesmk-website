name: Apply Credential Box Refinement

on: [push]

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reduce and reposition credential boxes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          marker = 'credential-box-refinement'
          if marker in h:
              raise SystemExit(0)
          css = r'''\n<style id="credential-box-refinement">\n.credentials-section .credential-cards{width:calc(100% - 500px) !important;margin-left:500px !important;margin-right:0 !important;margin-top:2px !important;gap:9px !important;}\n.credentials-section .credential-card{height:228px !important;min-height:228px !important;padding:8px 9px 9px !important;border-radius:8px !important;}\n.credentials-section .credential-mark{height:64px !important;min-height:64px !important;margin-bottom:5px !important;padding:3px !important;border-radius:7px !important;}\n.credentials-section .credential-mark img{width:54px !important;height:54px !important;max-width:58px !important;max-height:54px !important;}\n.credentials-section .credential-mark strong{font-size:1.34rem !important;}\n.credentials-section .cpp-mark strong{font-size:1.62rem !important;}\n.credentials-section .csmp-mark strong{font-size:1.5rem !important;}\n.credentials-section .csmp-mark small{font-size:.42rem !important;letter-spacing:.13em !important;margin-top:2px !important;}\n.credentials-section .asis-mark strong{font-size:1.56rem !important;}\n.credentials-section .ismi-mark strong{font-size:1.08rem !important;}\n.credentials-section .credential-card h4{font-size:.76rem !important;line-height:1.1 !important;min-height:32px !important;margin:3px 0 0 !important;}\n.credentials-section .credential-card .gold-rule.tiny{width:27px !important;margin:5px auto 6px !important;}\n.credentials-section .credential-card p{font-size:.63rem !important;line-height:1.28 !important;margin:0 !important;}\n@media(max-width:1100px){.credentials-section .credential-cards{width:100% !important;margin-left:0 !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;}.credentials-section .credential-card{height:auto !important;min-height:225px !important;}}\n@media(max-width:700px){.credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important;}.credentials-section .credential-card{min-height:220px !important;}.credentials-section .credential-mark{height:66px !important;min-height:66px !important;}}\n</style>\n'''
          h = h.replace('</style>', css + '</style>', 1)
          p.write_text(h, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce credential box proportions"
          git push
          git rm .github/workflows/credential-box-refine.yml
          git commit -m "Remove temporary credential refinement workflow"
          git push
