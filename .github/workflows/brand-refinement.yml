name: HESMK brand refinement

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-brand:
    if: "!contains(github.event.head_commit.message, 'Refine HESMK brand header')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine header and logo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Lighter, warm-neutral top banner: preserves navy/gold brand palette
          s = s.replace(
              'background: rgba(8,24,39,.93);\n      backdrop-filter: blur(14px);\n      border-bottom: 1px solid rgba(255,255,255,.08);',
              'background: rgba(246,244,238,.98);\n      backdrop-filter: blur(14px);\n      border-bottom: 1px solid rgba(8,24,39,.10);\n      box-shadow: 0 8px 24px rgba(8,24,39,.06);',
              1,
          )

          s = s.replace(
              '.brand {\n      display: flex;\n      align-items: center;\n      gap: 12px;\n      color: var(--white);\n      font-weight: 900;\n      letter-spacing: .04em;\n    }',
              '.brand {\n      display: inline-flex;\n      flex-direction: column;\n      align-items: flex-start;\n      justify-content: center;\n      gap: 4px;\n      color: var(--navy);\n      font-weight: 900;\n      letter-spacing: .04em;\n      width: 210px;\n    }',
              1,
          )

          # Replace image-based header logo with a precise text lockup.
          s, n = re.subn(
              r'<img\b[^>]*class=["\']brand-logo["\'][^>]*>',
              '<span class="brand-wordmark">HESMK</span><span class="brand-submark">INTEGRATED SOLUTIONS</span>',
              s,
              count=1,
              flags=re.I,
          )
          if n != 1:
              raise SystemExit('Could not locate brand-logo image in index.html')

          # Remove the now-unused image styling and add the exact lockup styling.
          old = '''    .brand-logo {\n      width: 235px;\n      height: auto;\n      max-height: 64px;\n      object-fit: contain;\n      display: block;\n    }'''
          new = '''    .brand-wordmark {\n      display: inline-block;\n      color: var(--navy);\n      font-size: 1.55rem;\n      line-height: 1;\n      font-weight: 950;\n      letter-spacing: .16em;\n      padding-left: .16em;\n    }\n\n    .brand-submark {\n      display: inline-block;\n      width: max-content;\n      color: var(--steel);\n      font-size: .53rem;\n      line-height: 1.15;\n      letter-spacing: .19em;\n      font-weight: 800;\n      border-top: 1px solid var(--accent);\n      padding-top: 4px;\n    }'''
          if old not in s:
              raise SystemExit('Expected .brand-logo CSS block not found')
          s = s.replace(old, new, 1)

          # Header navigation/menu now sits on the light banner.
          s = s.replace('color: #dbe2e7;\n      font-size: .86rem;\n      font-weight: 650;',
                        'color: var(--navy);\n      font-size: .86rem;\n      font-weight: 650;', 1)
          s = s.replace('color: white;\n      font-size: 1.7rem;',
                        'color: var(--navy);\n      font-size: 1.7rem;', 1)

          # Any small descriptor in the header should remain readable on light background.
          s = s.replace('color: #aeb9c2;\n      font-size: .58rem;',
                        'color: var(--steel);\n      font-size: .58rem;', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q 'brand-wordmark' index.html
          grep -q 'background: rgba(246,244,238,.98)' index.html

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'HESMK Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/brand-refinement.yml
          git commit -m 'Refine HESMK brand header'
          git push
