name: Apply Option 6 Profile Name

on:
  push:
    paths:
      - .github/workflows/apply-option6-profile.yml

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Option 6 profile descriptor only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          role_pattern = r'(<div class="profile-role">)\s*Security\s*&amp;\s*Risk\s*Professional\s*<span>•</span>\s*Former SSG Officer\s*(</div>)'
          s, role_count = re.subn(
              role_pattern,
              r'\1Former SSG Officer\2\n              <div class="profile-tagline">EXPERIENCE | INSIGHT | PRACTICAL SOLUTIONS</div>',
              s,
              count=1
          )

          if role_count != 1:
              raise SystemExit(f'Expected exactly one profile-role replacement, got {role_count}')

          style_marker = '    /* OPTION-6-PROFILE-TAGLINE */'
          style_block = '''    /* OPTION-6-PROFILE-TAGLINE */\n    .profile-tagline {\n      margin-top: 8px;\n      color: var(--navy);\n      font-size: .78rem;\n      font-weight: 800;\n      letter-spacing: .18em;\n    }\n'''
          if style_marker not in s:
              anchor = '    /* CREDENTIALS */'
              if anchor not in s:
                  raise SystemExit('Could not find credentials CSS anchor')
              s = s.replace(anchor, style_block + '\n' + anchor, 1)

          p.write_text(s, encoding='utf-8')
          print(f'role_count={role_count}, changed={s != original}')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Apply Option 6 leadership profile descriptor"
          git push
