name: Clear Credential Separation

on:
  push:
    paths:
      - '.github/workflows/credential-clear-separation.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create clear separation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
<style id="credential-clear-separation">
/* FINAL: keep credential cards completely inside the right-hand credential zone */
.credentials-section .credential-cards{
  width:calc(100% - 610px) !important;
  margin-left:610px !important;
  margin-right:0 !important;
  margin-top:8px !important;
  gap:8px !important;
  position:relative !important;
  z-index:3 !important;
}
.credentials-section .credential-card{
  height:218px !important;
  min-height:218px !important;
  padding:7px 8px 8px !important;
  border-radius:8px !important;
}
.credentials-section .credential-mark{
  height:58px !important;
  min-height:58px !important;
  margin-bottom:5px !important;
  padding:2px !important;
  border-radius:7px !important;
}
.credentials-section .credential-mark img{
  width:48px !important;
  height:48px !important;
  max-width:50px !important;
  max-height:48px !important;
}
.credentials-section .credential-mark strong{font-size:1.22rem !important;}
.credentials-section .cpp-mark strong{font-size:1.48rem !important;}
.credentials-section .csmp-mark strong{font-size:1.38rem !important;}
.credentials-section .csmp-mark small{font-size:.39rem !important;letter-spacing:.11em !important;}
.credentials-section .asis-mark strong{font-size:1.43rem !important;}
.credentials-section .ismi-mark strong{font-size:.98rem !important;}
.credentials-section .credential-card h4{
  font-size:.72rem !important;
  line-height:1.08 !important;
  min-height:30px !important;
  margin:3px 0 0 !important;
}
.credentials-section .credential-card .gold-rule.tiny{
  width:24px !important;
  margin:4px auto 5px !important;
}
.credentials-section .credential-card p{
  font-size:.59rem !important;
  line-height:1.22 !important;
  margin:0 !important;
}
@media(max-width:1100px){
  .credentials-section .credential-cards{
    width:100% !important;
    margin-left:0 !important;
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  }
  .credentials-section .credential-card{height:auto !important;min-height:215px !important;}
}
@media(max-width:700px){
  .credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important;}
  .credentials-section .credential-card{min-height:210px !important;}
}
</style>
'''
          marker = 'id="credential-clear-separation"'
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Create clear separation for credential cards"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/credential-clear-separation.yml
          git commit -m "Remove temporary credential separation workflow"
          git push
