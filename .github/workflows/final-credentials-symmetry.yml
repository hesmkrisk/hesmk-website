name: Apply Final Credentials Symmetry

on: [push]

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final reference proportions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          marker = 'FINAL CREDENTIALS SYMMETRY REFERENCE'
          if marker in h:
              raise SystemExit(0)
          css = r'''\n/* FINAL CREDENTIALS SYMMETRY REFERENCE */\n.credentials-section{padding:38px 0 18px !important;}\n.credentials-section .credentials-top{display:grid !important;grid-template-columns:1.12fr 1.18fr .72fr !important;gap:30px !important;align-items:start !important;margin:4px 0 8px !important;}\n.credentials-section .credentials-headline{min-width:0 !important;}\n.credentials-section .credentials-headline h2{font-size:clamp(2.55rem,3.65vw,3.35rem) !important;line-height:1.01 !important;letter-spacing:-.035em !important;margin:0 0 18px !important;}\n.credentials-section .credentials-headline p{max-width:365px !important;font-size:.91rem !important;line-height:1.48 !important;}\n.credentials-section .credentials-profile{padding-left:28px !important;min-height:174px !important;}\n.credentials-section .credentials-profile h3{font-size:clamp(2.45rem,3.35vw,3.25rem) !important;line-height:1 !important;margin:0 !important;}\n.credentials-section .profile-role{font-size:.72rem !important;letter-spacing:.22em !important;margin-top:9px !important;}\n.credentials-section .credentials-profile .gold-rule.small{margin:10px 0 13px !important;}\n.credentials-section .profile-former{font-size:1.14rem !important;}\n.credentials-section .credentials-quote{padding-top:2px !important;}\n.credentials-section .credentials-quote p{font-size:1.25rem !important;line-height:1.28 !important;margin:8px 0 0 !important;}\n.credentials-section .quote-mark{font-size:4.1rem !important;line-height:.55 !important;}\n.credentials-section .credentials-quote .gold-rule.small{margin-top:14px !important;}\n.credentials-section .credential-cards{display:grid !important;grid-template-columns:repeat(5,minmax(0,1fr)) !important;gap:10px !important;width:calc(100% - 390px) !important;margin-left:390px !important;margin-right:0 !important;margin-top:4px !important;position:relative !important;z-index:2 !important;}\n.credentials-section .credential-card{height:258px !important;min-height:258px !important;padding:9px 10px 11px !important;border-radius:9px !important;overflow:hidden !important;}\n.credentials-section .credential-mark{height:78px !important;min-height:78px !important;margin-bottom:7px !important;padding:4px !important;border-radius:8px !important;display:flex !important;align-items:center !important;justify-content:center !important;}\n.credentials-section .credential-mark img{width:66px !important;height:66px !important;max-width:72px !important;max-height:66px !important;object-fit:contain !important;}\n.credentials-section .credential-mark strong{font-size:1.52rem !important;line-height:1 !important;}\n.credentials-section .cpp-mark strong{font-size:1.85rem !important;}\n.credentials-section .csmp-mark strong{font-size:1.7rem !important;}\n.credentials-section .csmp-mark small{font-size:.47rem !important;letter-spacing:.16em !important;margin-top:3px !important;}\n.credentials-section .asis-mark strong{font-size:1.8rem !important;}\n.credentials-section .ismi-mark strong{font-size:1.25rem !important;}\n.credentials-section .credential-card h4{font-size:.82rem !important;line-height:1.12 !important;min-height:36px !important;margin:4px 0 0 !important;}\n.credentials-section .credential-card .gold-rule.tiny{width:32px !important;margin:6px auto 8px !important;}\n.credentials-section .credential-card p{font-size:.68rem !important;line-height:1.32 !important;text-align:left !important;margin:0 !important;}\n@media(max-width:1100px){.credentials-section .credentials-top{grid-template-columns:1fr 1fr !important}.credentials-section .credentials-quote{grid-column:2 !important}.credentials-section .credential-cards{width:100% !important;margin-left:0 !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;}.credentials-section .credential-card{height:auto !important;min-height:245px !important;}}\n@media(max-width:700px){.credentials-section .credentials-top{grid-template-columns:1fr !important}.credentials-section .credentials-quote{grid-column:auto !important}.credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important}.credentials-section .credential-card{min-height:235px !important}.credentials-section .credential-mark{height:72px !important;min-height:72px !important}}\n'''
          h = h.replace('</style>', css + '</style>', 1)
          p.write_text(h, encoding='utf-8')
          print('Final credentials symmetry CSS applied.')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match credentials section to proportional reference"
          git push
          git rm .github/workflows/final-credentials-symmetry.yml
          git commit -m "Remove temporary symmetry workflow"
          git push
