name: Compact HESMK Styling
on:
  push:
    paths:
      - '.github/workflows/compact-styling.yml'

jobs:
  compact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tighten spacing and typography
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '.section { padding: 78px 0; }': '.section { padding: 62px 0; }',
              'h1 { font-size: clamp(3rem, 7vw, 5.8rem); }': 'h1 { font-size: clamp(2.5rem, 5.2vw, 4.5rem); }',
              'h2 { font-size: clamp(2.1rem, 4vw, 3.5rem); }': 'h2 { font-size: clamp(1.8rem, 3.2vw, 2.75rem); }',
              'h3 { font-size: 1.25rem; }': 'h3 { font-size: 1.08rem; }',
              'margin-bottom: 17px;': 'margin-bottom: 12px;',
              '.hero-content {\n      position: relative;\n      z-index: 2;\n      max-width: 830px;\n      padding: 68px 0;\n    }': '.hero-content {\n      position: relative;\n      z-index: 2;\n      max-width: 830px;\n      padding: 48px 0;\n    }',
              'margin-bottom: 22px;\n    }\n\n    .hero h1 span': 'margin-bottom: 18px;\n    }\n\n    .hero h1 span',
              'font-size: 1.05rem;\n      color: #c2cdd5;\n      margin-bottom: 28px;': 'font-size: .98rem;\n      color: #c2cdd5;\n      margin-bottom: 22px;',
              'margin-top: 34px;': 'margin-top: 24px;',
              'gap: 55px;': 'gap: 42px;',
              'margin-top: 24px;\n    }\n\n    .risk-chain': 'margin-top: 16px;\n    }\n\n    .risk-chain',
              'padding: 38px;\n      border-radius: var(--radius);': 'padding: 28px;\n      border-radius: var(--radius);',
              'margin-bottom: 28px;\n    }\n\n    .chain': 'margin-bottom: 20px;\n    }\n\n    .chain',
              'margin-bottom: 54px;': 'margin-bottom: 34px;',
              'padding: 28px 24px;\n      min-height: 220px;': 'padding: 22px 20px;\n      min-height: 190px;',
              'margin-bottom: 34px;\n    }\n\n    .method-card h3': 'margin-bottom: 24px;\n    }\n\n    .method-card h3',
              'padding: 28px;\n      border: 1px solid var(--border);': 'padding: 22px;\n      border: 1px solid var(--border);',
              'margin-bottom: 22px;\n      font-weight: 900;': 'margin-bottom: 16px;\n      font-weight: 900;',
              'gap: 8px 20px;\n      margin-top: 22px;': 'gap: 6px 16px;\n      margin-top: 16px;',
              'min-height: 145px;\n      padding: 22px;': 'min-height: 118px;\n      padding: 18px;',
              'margin-bottom: 9px; }\n    .sector p': 'margin-bottom: 7px; }\n    .sector p',
              'padding: 60px;\n      border-radius: 20px;': 'padding: 42px;\n      border-radius: 18px;',
              'min-height: 380px;': 'min-height: 300px;',
              'padding: 30px;\n    }\n\n    .founder-portrait strong': 'padding: 22px;\n    }\n\n    .founder-portrait strong',
              'margin-bottom: 20px; }\n\n    .founder-copy p': 'margin-bottom: 14px; }\n\n    .founder-copy p',
              'gap: 90px;': 'gap: 55px;',
              'padding: 18px 0;': 'padding: 13px 0;',
              'margin-bottom: 30px;': 'margin-bottom: 22px;',
              'gap: 13px;\n      padding: 28px;': 'gap: 10px;\n      padding: 22px;',
              'padding: 50px 0 22px;': 'padding: 38px 0 18px;',
              'gap: 60px;\n      padding-bottom: 45px;': 'gap: 40px;\n      padding-bottom: 32px;',
              'padding-top: 24px;': 'padding-top: 18px;',
              'gap: 20px;\n      padding-top: 24px;': 'gap: 16px;\n      padding-top: 18px;',
              '.section { padding: 75px 0; }': '.section { padding: 56px 0; }',
              '.hero-content { padding: 70px 0; }': '.hero-content { padding: 52px 0; }',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No styling changes detected"; exit 0; }
          git commit -m "Tighten layout and typography"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/compact-styling.yml
          git commit -m "Remove temporary compact styling workflow"
          git push
