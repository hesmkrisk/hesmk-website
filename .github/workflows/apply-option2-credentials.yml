name: Apply Option 2 Centered Credentials Layout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-option2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Option 2 layout CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = '<style id="OPTION-2-CENTERED-CREDENTIALS">'

          css = r'''<style id="OPTION-2-CENTERED-CREDENTIALS">
          /* OPTION 2 — CENTERED CREDENTIALS LAYOUT */
          .credentials-section{padding:58px 0 52px !important;background:#fff !important;}
          .credentials-section > .container{display:grid !important;grid-template-columns:1fr !important;align-items:center !important;text-align:center !important;}
          .credentials-section .credentials-top{display:contents !important;}
          .credentials-section > .container > .eyebrow{order:1 !important;justify-self:center !important;margin:0 0 14px !important;}
          .credentials-section .credentials-profile{order:2 !important;border:0 !important;padding:0 !important;margin:0 !important;min-height:0 !important;text-align:center !important;}
          .credentials-section .credentials-profile h3{font-size:clamp(2.65rem,4vw,3.45rem) !important;line-height:1 !important;margin:0 !important;}
          .credentials-section .profile-role{font-size:.72rem !important;letter-spacing:.22em !important;margin-top:9px !important;}
          .credentials-section .credentials-profile .gold-rule.small{margin:9px auto 10px !important;}
          .credentials-section .profile-former{font-size:1.12rem !important;}
          .credentials-section .credentials-quote{order:3 !important;display:flex !important;justify-content:center !important;align-items:center !important;gap:9px !important;padding:0 !important;margin:12px auto 20px !important;max-width:650px !important;}
          .credentials-section .credentials-quote .quote-mark{font-size:2.8rem !important;line-height:.6 !important;}
          .credentials-section .credentials-quote p{font-size:1rem !important;line-height:1.3 !important;margin:0 !important;}
          .credentials-section .credentials-quote .gold-rule.small{display:none !important;}
          .credentials-section .credential-cards{order:4 !important;width:100% !important;margin:0 !important;padding:0 !important;display:grid !important;grid-template-columns:repeat(5,minmax(0,1fr)) !important;gap:12px !important;}
          .credentials-section .credential-card{height:226px !important;min-height:226px !important;padding:10px 10px 12px !important;border-radius:9px !important;}
          .credentials-section .credential-mark{height:70px !important;min-height:70px !important;margin-bottom:7px !important;padding:3px !important;border-radius:8px !important;}
          .credentials-section .credential-mark img{width:52px !important;height:52px !important;max-width:56px !important;max-height:52px !important;}
          .credentials-section .credential-mark strong{font-size:1.42rem !important;}
          .credentials-section .cpp-mark strong{font-size:1.7rem !important;}
          .credentials-section .csmp-mark strong{font-size:1.55rem !important;}
          .credentials-section .asis-mark strong{font-size:1.62rem !important;}
          .credentials-section .ismi-mark strong{font-size:1.12rem !important;}
          .credentials-section .csmp-mark small{font-size:.43rem !important;}
          .credentials-section .credential-card h4{font-size:.78rem !important;line-height:1.08 !important;min-height:34px !important;margin:3px 0 0 !important;}
          .credentials-section .credential-card .gold-rule.tiny{width:24px !important;margin:4px auto 6px !important;}
          .credentials-section .credential-card p{font-size:.62rem !important;line-height:1.25 !important;text-align:center !important;margin:0 !important;}
          .credentials-section .credentials-headline{order:5 !important;border:0 !important;padding:0 !important;margin:20px auto 0 !important;max-width:980px !important;text-align:center !important;}
          .credentials-section .credentials-headline h2{font-size:clamp(1.65rem,2.3vw,2.15rem) !important;line-height:1.15 !important;letter-spacing:-.025em !important;margin:0 0 12px !important;white-space:nowrap !important;}
          .credentials-section .credentials-headline h2 br{display:none !important;}
          .credentials-section .credentials-headline .gold-rule{margin:0 auto 12px !important;width:42px !important;}
          .credentials-section .credentials-headline p{max-width:820px !important;margin:0 auto !important;font-size:.88rem !important;line-height:1.5 !important;text-align:center !important;}
          @media(max-width:1050px){
            .credentials-section .credential-cards{grid-template-columns:repeat(3,minmax(0,1fr)) !important;}
            .credentials-section .credentials-headline h2{white-space:normal !important;}
            .credentials-section .credentials-headline h2 br{display:block !important;}
          }
          @media(max-width:700px){
            .credentials-section{padding:48px 0 42px !important;}
            .credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:9px !important;}
            .credentials-section .credential-card{height:auto !important;min-height:220px !important;}
            .credentials-section .credentials-profile h3{font-size:2.5rem !important;}
            .credentials-section .credentials-quote{max-width:95% !important;}
            .credentials-section .credentials-headline h2{font-size:1.8rem !important;}
          }
          @media(max-width:430px){
            .credentials-section .credential-cards{grid-template-columns:1fr !important;}
          }
          </style>'''

          if marker in html:
              raise SystemExit("Option 2 CSS already present; no change required.")

          html = html.replace('</head>', css + '\n</head>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply Option 2 centered credentials layout"
          git push
