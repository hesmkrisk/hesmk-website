name: SEO Step 8 - Standardize Service Schema
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  schema:
    if: ${{ !contains(github.event.head_commit.message, 'SEO Step 8: standardize service schema') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize JSON-LD on service pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            'security-risk-assessment.html',
            'security-risk-management.html',
            'physical-protective-security.html',
            'counter-terrorism-threat-management.html',
            'organizational-resilience-business-continuity.html'
          ]
          for name in files:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if '"inLanguage":"en"' in s:
                  continue
              s = s.replace('"about":{"@id":"https://hesmk.com.pk/' , '"inLanguage":"en",\n        "about":{"@id":"https://hesmk.com.pk/', 1)
              s = s.replace('"provider":{"@id":"https://hesmk.com.pk/#organization"},', '"provider":{"@id":"https://hesmk.com.pk/#organization"},\n        "url":"https://hesmk.com.pk/' + name + '",', 1)
              s = s.replace('"about":{"@id":"https://hesmk.com.pk/' + name + '#service"}\n', '"about":{"@id":"https://hesmk.com.pk/' + name + '#service"},\n        "mainEntity":{"@id":"https://hesmk.com.pk/' + name + '#service"},\n        "inLanguage":"en"\n', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit schema improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-risk-assessment.html security-risk-management.html physical-protective-security.html counter-terrorism-threat-management.html organizational-resilience-business-continuity.html
          git diff --cached --quiet && exit 0
          git commit -m "SEO Step 8: standardize service schema"
          git push
