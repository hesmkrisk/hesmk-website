name: Fix Risk Cycle Layout
on:
  push:
    paths:
      - '.github/workflows/fix-risk-cycle-layout.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Arrange risk cycle symmetrically
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = r'''    .risk-chain .chain {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .risk-chain .chain span {
      text-align: center;
      white-space: nowrap;
    }

    .risk-chain .chain span:nth-of-type(5) {
      grid-column: 1 / span 3;
    }

    .risk-chain .chain span:nth-of-type(6) {
      grid-column: 4 / span 2;
    }

    .risk-chain .chain span:nth-of-type(7) {
      grid-column: 6 / span 2;
    }

    .risk-chain .chain span:nth-of-type(8) {
      grid-column: 8 / span 2;
    }

    .risk-chain .chain span:nth-of-type(9) {
      grid-column: 10 / span 2;
    }
'''
          new_css = r'''    .risk-chain .chain {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .risk-chain .cycle-row {
      display: grid;
      grid-template-columns: minmax(125px, 1fr) 28px minmax(125px, 1fr) 28px minmax(125px, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 690px;
      align-items: center;
    }

    .risk-chain .cycle-step {
      padding: 10px 11px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.045);
      border-radius: 6px;
      font-size: .74rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .risk-chain .cycle-arrow {
      color: var(--accent-light);
      font-weight: 800;
      text-align: center;
      font-size: .9rem;
    }

    .risk-chain .cycle-down {
      color: var(--accent-light);
      font-weight: 800;
      line-height: 1;
      font-size: .95rem;
      height: 9px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      max-width: 690px;
      padding-right: 16.5%;
    }
'''
          if old_css not in s:
              raise SystemExit('Old risk cycle CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_html = r'''        <div class="chain">
  <span>Context</span><b>→</b>
  <span>Assets</span><b>→</b>
  <span>Threats</span><b>→</b>
  <span>Vulnerabilities</span>
  <span>Consequences</span><b>→</b>
  <span>Risk</span><b>→</b>
  <span>Controls</span><b>→</b>
  <span>Cost</span>
  <span>Resilience</span>
</div>'''
          new_html = r'''        <div class="chain">
          <div class="cycle-row">
            <span class="cycle-step">Context</span><span class="cycle-arrow">→</span>
            <span class="cycle-step">Assets</span><span class="cycle-arrow">→</span>
            <span class="cycle-step">Threats</span>
          </div>
          <div class="cycle-down">↓</div>
          <div class="cycle-row">
            <span class="cycle-step">Vulnerabilities</span><span class="cycle-arrow">→</span>
            <span class="cycle-step">Consequences</span><span class="cycle-arrow">→</span>
            <span class="cycle-step">Risk</span>
          </div>
          <div class="cycle-down">↓</div>
          <div class="cycle-row">
            <span class="cycle-step">Controls</span><span class="cycle-arrow">→</span>
            <span class="cycle-step">Cost</span><span class="cycle-arrow">→</span>
            <span class="cycle-step">Resilience</span>
          </div>
        </div>'''
          if old_html not in s:
              raise SystemExit('Old risk cycle HTML not found')
          s = s.replace(old_html, new_html, 1)

          mobile_anchor = '      .risk-chain .chain {\n        grid-template-columns: 1fr;\n      }\n\n      .risk-chain .chain span,\n      .risk-chain .chain b {\n        grid-column: auto !important;\n      }\n\n      .risk-chain .chain b {\n        text-align: center;\n      }\n'
          mobile_new = r'''      .risk-chain .cycle-row {
        grid-template-columns: minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr);
        gap: 5px;
      }

      .risk-chain .cycle-step {
        font-size: .68rem;
        padding: 9px 5px;
      }

      .risk-chain .cycle-arrow { font-size: .8rem; }

      .risk-chain .cycle-down {
        padding-right: 16%;
      }
'''
          if mobile_anchor not in s:
              raise SystemExit('Mobile risk cycle CSS not found')
          s = s.replace(mobile_anchor, mobile_new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['Risk-Informed Security Cycle','Context','Assets','Threats','Vulnerabilities','Consequences','Risk','Controls','Cost','Resilience','cycle-row','cycle-down']
          for item in required:
              if item not in s:
                  raise SystemExit(f'Missing: {item}')

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Arrange risk-informed cycle symmetrically"
          git push
          git rm .github/workflows/fix-risk-cycle-layout.yml
          git commit -m "Remove temporary cycle layout workflow"
          git push