name: Update HESMK Contact Number
on: push
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace contact number
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '03215300549'
          new = '+92 321 5300549'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Old contact number not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print(f'Replaced {count} occurrence(s)')
          PY
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update HESMK contact number to international format"
          git push
          git rm .github/workflows/update-phone.yml
          git commit -m "Remove temporary phone update workflow"
          git push
