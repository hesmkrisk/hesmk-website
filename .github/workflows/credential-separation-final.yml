name: Final credential separation
on:
  push:
    paths:
      - '.github/workflows/credential-separation-final.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separate credential strip from left headline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          <style id="final-credential-separation">
          /* FINAL: keep credential cards completely clear of the left narrative */
          .credentials-section .credential-cards{
            width:calc(100% - 600px) !important;
            margin-left:600px !important;
            margin-right:0 !important;
            gap:8px !important;
            margin-top:2px !important;
          }
          .credentials-section .credential-card{
            height:220px !important;
            min-height:220px !important;
            padding:7px 8px 8px !important;
            border-radius:8px !important;
          }
          .credentials-section .credential-mark{
            height:58px !important;
            min-height:58px !important;
            margin-bottom:4px !important;
            padding:2px !important;
            border-radius:7px !important;
          }
          .credentials-section .credential-mark img{
            width:48px !important;
            height:48px !important;
            max-width:52px !important;
            max-height:48px !important;
          }
          .credentials-section .credential-mark strong{font-size:1.20rem !important;}
          .credentials-section .cpp-mark strong{font-size:1.48rem !important;}
          .credentials-section .csmp-mark strong{font-size:1.38rem !important;}
          .credentials-section .csmp-mark small{font-size:.39rem !important;letter-spacing:.11em !important;margin-top:1px !important;}
          .credentials-section .asis-mark strong{font-size:1.42rem !important;}
          .credentials-section .ismi-mark strong{font-size:1rem !important;}
          .credentials-section .credential-card h4{
            font-size:.70rem !important;
            line-height:1.08 !important;
            min-height:30px !important;
            margin:3px 0 0 !important;
          }
          .credentials-section .credential-card .gold-rule.tiny{
            width:24px !important;
            margin:4px auto 5px !important;
          }
          .credentials-section .credential-card p{
            font-size:.59rem !important;
            line-height:1.24 !important;
            margin:0 !important;
          }
          @media(max-width:1100px){
            .credentials-section .credential-cards{
              width:100% !important;
              margin-left:0 !important;
              grid-template-columns:repeat(3,minmax(0,1fr)) !important;
            }
            .credentials-section .credential-card{height:auto !important;min-height:220px !important;}
          }
          @media(max-width:700px){
            .credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important;}
            .credentials-section .credential-card{min-height:215px !important;}
          }
          </style>
          '''
          marker = 'id="final-credential-separation"'
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate credential cards from left headline"
          git push
          git rm .github/workflows/credential-separation-final.yml
          git commit -m "Remove temporary credential separation workflow"
          git push
