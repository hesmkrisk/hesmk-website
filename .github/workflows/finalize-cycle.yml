name: Finalize Risk Cycle
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout
        run: python3 -c "import base64;exec(base64.b64decode('  etc...'))" 
      - name: Validate
        run: grep -q 'cycle-row' index.html && grep -q 'Context' index.html && grep -q 'Resilience' index.html
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Arrange risk-informed cycle symmetrically"
          git push
          git rm .github/workflows/finalize-cycle.yml
          git commit -m "Remove temporary cycle workflow"
          git push
