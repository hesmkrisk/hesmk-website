name: One-Time Profile Name Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-profile-name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace profile name only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="profile-name">Lt Col Khalid Habib (Retd.)</div>'
          new = '<div class="profile-name">Khalid Habib</div>'
          if old not in s:
              raise SystemExit('Target profile name not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Change leadership profile name to Khalid Habib"
            git push
          fi
