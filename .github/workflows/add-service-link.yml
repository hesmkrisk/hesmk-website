name: Add Security Risk Assessment internal link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-homepage:
    if: ${{ !contains(github.event.head_commit.message, 'Add internal link to Security Risk Assessment page') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add service link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#contact" onclick="closeMenu()">Contact</a>'
          new = '<a href="#capabilities" onclick="closeMenu()">Capabilities</a>\n      ' + old
          if old not in s or 'security-risk-assessment.html' in s:
              raise SystemExit('Expected navigation marker missing or link already present')
          s = s.replace(old, new, 1)
          old2 = '<div class="cap-cell capability">Security Risk Assessment</div>'
          new2 = '<div class="cap-cell capability"><a href="security-risk-assessment.html" style="color:inherit;text-decoration:underline;text-decoration-color:rgba(184,148,85,.55);text-underline-offset:3px">Security Risk Assessment</a></div>'
          if old2 not in s:
              raise SystemExit('Expected capability marker missing')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add internal link to Security Risk Assessment page"
          git push
