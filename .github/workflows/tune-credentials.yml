name: Tune HESMK Credentials

on: [push]

jobs:
  tune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          # Reduce the credential-logo area and tighten the gap between profile and cards.
          h=h.replace('.credentials-top{display:grid;', '.credentials-top{display:grid;')
          h=h.replace('.credential-mark{', '.credential-mark{')
          # Add a final override so existing design remains intact except requested spacing/scale.
          override='''\n/* FINAL CREDENTIAL SYMMETRY TUNING */\n.credentials-section .credentials-top{margin-bottom:18px;}\n.credentials-section .credential-cards{gap:10px;}\n.credentials-section .credential-mark{height:112px;min-height:112px;padding:10px 8px;margin-bottom:10px;}\n.credentials-section .credential-mark img{max-height:82px;max-width:110px;object-fit:contain;}\n.credentials-section .credential-mark strong{font-size:2rem;}\n.credentials-section .credential-card{padding:16px 12px 14px;}\n.credentials-section .credential-card h4{margin-top:8px;}\n.credentials-section .csmp-mark strong:first-child{display:none;}\n.credentials-section .csmp-mark span{display:none;}\n.credentials-section .csmp-mark strong:nth-of-type(2){display:block;font-size:2.05rem;}\n.credentials-section .csmp-mark small{display:block;}\n@media(max-width:900px){.credentials-section .credential-mark{height:100px;min-height:100px;}}\n'''
          h=h.replace('</style>',override+'\n</style>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine credential card symmetry and spacing"
          git push
