name: Apply Credentials Design

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply leadership credentials design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = 'id="leadership-credentials"'
          if marker in text:
              print('Credentials design already present; nothing to do.')
              raise SystemExit(0)

          css = r'''
<style id="hesmk-credentials-design">
/* Leadership & Professional Credentials — reference layout */
.cred-section{background:#fff;padding:54px 3.3% 34px;position:relative;overflow:hidden}
.cred-section *{box-sizing:border-box}
.cred-label{display:flex;align-items:center;gap:14px;margin:0 0 20px;color:#b89455;font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.cred-label:before{content:"";display:block;width:48px;height:2px;background:#b89455;flex:0 0 48px}
.cred-main{display:grid;grid-template-columns:31% 69%;gap:0;max-width:100%;align-items:stretch}
.cred-left{padding:0 42px 0 0}
.cred-left h2{margin:0;color:#081827;font-family:Georgia,'Times New Roman',serif;font-size:clamp(48px,4.25vw,68px);line-height:.98;font-weight:700;letter-spacing:-.035em}
.cred-rule{width:62px;height:3px;background:#b89455;margin:27px 0 26px}
.cred-left p{margin:0;max-width:390px;color:#274866;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.5}
.cred-right{min-width:0}
.cred-top{display:grid;grid-template-columns:61% 39%;min-height:193px}
.cred-profile{border-left:1px solid #cfd6dc;padding:0 42px 0 38px}
.cred-name{margin:0;color:#081827;font-family:Georgia,'Times New Roman',serif;font-size:clamp(48px,4.2vw,70px);line-height:.95;font-weight:700;letter-spacing:-.035em}
.cred-role{margin:14px 0 0;color:#b89455;font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:700;letter-spacing:.30em;text-transform:uppercase}
.cred-profile .cred-rule{margin:22px 0 19px;width:60px;height:3px}
.cred-former{margin:0;color:#081827;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.15}
.cred-quote{padding:0 0 0 26px;position:relative;color:#183c62;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-style:italic;line-height:1.4}
.cred-quote:before{content:'“';position:absolute;left:-2px;top:-28px;color:#b89455;font-family:Georgia,'Times New Roman',serif;font-size:74px;font-style:normal;line-height:1}
.cred-quote .cred-rule{margin:21px 0 0;width:61px;height:3px}
.cred-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:0}
.cred-card{min-width:0;min-height:342px;border:1px solid #dfe5ea;border-radius:9px;background:#fff;padding:12px 16px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 4px 18px rgba(8,24,39,.025)}
.cred-logo{height:120px;width:100%;border:1px solid #eadfca;border-radius:9px;background:#faf9f5;display:flex;align-items:center;justify-content:center;margin-bottom:17px;overflow:hidden}
.cred-logo.ssg{border-color:transparent;background:#fff}
.cred-logo img{width:102px;height:102px;object-fit:contain;display:block}
.cred-mono{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-.05em;color:#0d2c49;line-height:.9;font-size:48px}
.cred-mono.cpp{font-style:italic;font-size:53px;letter-spacing:-.10em}
.cred-mono.csmp{font-size:30px;letter-spacing:.02em}
.cred-mono.asis{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-style:italic;letter-spacing:-.07em}
.cred-mono.ismi{font-size:30px;letter-spacing:.02em}
.cred-card h3{margin:0;color:#081827;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.15;font-weight:700}
.cred-card .small-rule{width:43px;height:2px;background:#b89455;margin:13px auto 13px}
.cred-card p{margin:0;color:#4f6b88;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.42;text-align:left;width:100%}
@media(max-width:1050px){.cred-main{grid-template-columns:1fr}.cred-left{padding:0 0 34px}.cred-left p{max-width:680px}.cred-profile{border-left:0;border-top:1px solid #cfd6dc;padding:28px 28px 0 0}.cred-top{grid-template-columns:1fr 1fr}.cred-cards{grid-template-columns:repeat(3,1fr);gap:10px}.cred-card{min-height:320px}}
@media(max-width:700px){.cred-section{padding:40px 20px 28px}.cred-label{font-size:12px;letter-spacing:.08em}.cred-main{display:block}.cred-left h2{font-size:45px}.cred-top{display:block;min-height:0}.cred-profile{padding:30px 0 0;border-top:1px solid #cfd6dc}.cred-name{font-size:48px}.cred-quote{padding:32px 0 0 30px;margin-bottom:28px}.cred-cards{grid-template-columns:1fr 1fr;gap:10px}.cred-card{min-height:315px;padding:10px}.cred-logo{height:100px}.cred-card p{font-size:14px}}
@media(max-width:430px){.cred-cards{grid-template-columns:1fr}.cred-card{min-height:auto}.cred-logo{height:110px}}
</style>
'''

          section = r'''
<section class="cred-section" id="leadership-credentials">
  <div class="cred-label">Leadership &amp; Professional Credentials</div>
  <div class="cred-main">
    <div class="cred-left">
      <h2>Experience.<br>Certification.<br>Global Perspective.</h2>
      <div class="cred-rule"></div>
      <p>HESMK is led by a security and risk professional with operational experience in hostile environments and internationally recognized professional credentials, combining real-world insight with global best practices.</p>
    </div>

    <div class="cred-right">
      <div class="cred-top">
        <div class="cred-profile">
          <h3 class="cred-name">Khalid Habib</h3>
          <div class="cred-role">Security &amp; Risk Professional</div>
          <div class="cred-rule"></div>
          <p class="cred-former">Former SSG Officer</p>
        </div>
        <div class="cred-quote">
          Turning security<br>challenges into<br>resilient opportunities.
          <div class="cred-rule"></div>
        </div>
      </div>

      <div class="cred-cards">
        <article class="cred-card">
          <div class="cred-logo ssg"><img src="ssg-insignia.svg" alt="SSG insignia"></div>
          <h3>Former SSG Officer</h3>
          <div class="small-rule"></div>
          <p>Operational experience in hostile environments and counter-terrorism operations.</p>
        </article>
        <article class="cred-card">
          <div class="cred-logo"><div class="cred-mono cpp">CPP<sup style="font-size:.28em;vertical-align:top;letter-spacing:0">®</sup></div></div>
          <h3>Certified Protection Professional (CPP)</h3>
          <div class="small-rule"></div>
          <p>ASIS International (Global standard in security management).</p>
        </article>
        <article class="cred-card">
          <div class="cred-logo"><div class="cred-mono csmp">ISMI<br><span style="font-size:.62em;letter-spacing:.08em">CSMP</span><sup style="font-size:.3em">®</sup></div></div>
          <h3>Certified Security Management Professional Level 6</h3>
          <div class="small-rule"></div>
          <p>International Security Management Institute (UK).</p>
        </article>
        <article class="cred-card">
          <div class="cred-logo"><div class="cred-mono asis">ASIS</div></div>
          <h3>Professional Member</h3>
          <div class="small-rule"></div>
          <p>ASIS International (USA)<br>Part of a global community of security professionals.</p>
        </article>
        <article class="cred-card">
          <div class="cred-logo"><div class="cred-mono ismi">◉ ISMI</div></div>
          <h3>Professional Member</h3>
          <div class="small-rule"></div>
          <p>International Security Management Institute (UK)<br>Advancing professionalism in security management worldwide.</p>
        </article>
      </div>
    </div>
  </div>
</section>
'''

          # Insert the new stylesheet immediately before </head>.
          if '</head>' not in text:
              raise SystemExit('Could not find </head> in index.html')
          text = text.replace('</head>', css + '\n</head>', 1)

          # Insert credentials before Sectors, keeping the existing site structure untouched.
          match = re.search(r'<section[^>]*id=["\']sectors["\'][^>]*>', text, re.I)
          if not match:
              raise SystemExit('Could not find the Sectors section in index.html')
          text = text[:match.start()] + section + '\n' + text[match.start():]

          path.write_text(text, encoding='utf-8')
          print('Leadership credentials design inserted.')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-credentials-design.yml
          git commit -m "Apply leadership credentials reference design"
          git push
