name: Apply HESMK Leadership Credentials

on:
  push:
    branches: [main]

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply credentials section and corporate navy CTA/footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Use the supplied SSG insignia in vector form. The matching public SVG
          # is licensed CC BY-SA 4.0; the attribution is retained in the page.
          ssg_url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Insignia_of_Pakistan_Army_Special_Service_Group_(SSG).svg'
          try:
              urllib.request.urlretrieve(ssg_url, 'ssg-insignia.svg')
          except Exception as exc:
              print(f'SSG download warning: {exc}')

          css = r'''
          /* LEADERSHIP & PROFESSIONAL CREDENTIALS */
          .credentials-section{background:var(--white);}
          .credentials-grid{display:grid;grid-template-columns:.8fr 1.8fr;gap:48px;align-items:start;}
          .credentials-lead{padding-top:4px;}
          .credentials-lead h2{font-family:Georgia,serif;font-size:clamp(2.5rem,4vw,4rem);color:var(--navy);margin:0 0 22px;line-height:1.02;max-width:470px;}
          .credentials-lead h2 span{display:block;}
          .credentials-lead p{max-width:430px;color:#46647d;font-size:.98rem;}
          .credentials-name{border-left:1px solid rgba(8,24,39,.16);padding-left:42px;margin-bottom:28px;}
          .credentials-name h3{font-family:Georgia,serif;color:var(--navy);font-size:clamp(2rem,3.2vw,3.1rem);margin:0 0 6px;}
          .credentials-role{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-size:.8rem;font-weight:700;}
          .credentials-former{margin-top:14px;font-family:Georgia,serif;color:var(--navy);font-size:1.08rem;}
          .credential-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
          .credential-card{min-height:270px;padding:18px 14px 16px;background:#fff;border:1px solid rgba(8,24,39,.11);border-radius:12px;box-shadow:0 12px 28px rgba(8,24,39,.06);display:flex;flex-direction:column;align-items:center;text-align:left;}
          .credential-mark{width:100%;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:13px;color:var(--navy);font-family:Georgia,serif;font-weight:800;}
          .credential-mark.ssg img{width:82px;height:94px;object-fit:contain;}
          .credential-mark.wordmark{border:1px solid rgba(184,148,85,.24);background:#faf8f3;border-radius:8px;font-size:1.45rem;letter-spacing:.05em;text-align:center;}
          .credential-mark.wordmark small{display:block;font-family:Inter,ui-sans-serif,sans-serif;font-size:.55rem;letter-spacing:.08em;margin-top:6px;color:#607080;font-weight:700;}
          .credential-card h4{font-family:Georgia,serif;color:var(--navy);font-size:.94rem;line-height:1.18;text-align:center;margin-bottom:8px;min-height:42px;}
          .credential-card p{font-size:.78rem;color:#607080;line-height:1.48;text-align:left;margin:0;}
          .credential-rule{width:42px;height:2px;background:var(--accent);margin:8px auto 12px;}

          /* CORPORATE NAVY CTA + FOOTER */
          .resilience-cta{background:var(--navy);color:#fff;padding:50px 0 42px;border-top:1px solid rgba(255,255,255,.08);}
          .resilience-cta .container{display:grid;grid-template-columns:1.5fr auto;gap:40px;align-items:center;}
          .resilience-eyebrow{display:flex;align-items:center;gap:12px;color:var(--accent-light);text-transform:uppercase;letter-spacing:.17em;font-size:.72rem;font-weight:800;margin-bottom:14px;}
          .resilience-eyebrow::before{content:"";width:30px;height:1px;background:var(--accent);}
          .resilience-cta h2{font-family:Georgia,serif;color:#fff;font-size:clamp(2rem,3.3vw,3rem);margin:0;}
          .resilience-cta .btn{white-space:nowrap;}
          footer{background:var(--navy);color:#dbe3e8;border-top:1px solid rgba(255,255,255,.12);}
          footer .footer-title{color:#fff;}
          footer p{color:#aebbc5;}
          footer .footer-links a{color:#dbe3e8;}
          footer .footer-bottom{color:#92a2ae;border-top-color:rgba(255,255,255,.12);}
          .credentials-attribution{font-size:.62rem!important;color:#7f909c!important;margin-top:12px!important;}

          @media(max-width:1050px){.credentials-grid{grid-template-columns:1fr;gap:28px}.credentials-name{border-left:0;border-top:1px solid rgba(8,24,39,.16);padding:24px 0 0}.credential-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.resilience-cta .container{grid-template-columns:1fr;gap:22px}}
          @media(max-width:650px){.credentials-lead h2{font-size:2.6rem}.credential-cards{grid-template-columns:1fr 1fr}.credential-card{min-height:250px}.resilience-cta{padding:40px 0}.resilience-cta h2{font-size:2rem}.resilience-cta .btn{width:100%;justify-content:center}}
          @media(max-width:430px){.credential-cards{grid-template-columns:1fr}}
          '''

          section = r'''
          <!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->
          <section class="section credentials-section" id="credentials">
            <div class="container credentials-grid">
              <div class="credentials-lead reveal">
                <div class="eyebrow">Leadership &amp; Professional Credentials</div>
                <h2>Experience.<span>Certification.</span><span>Global Perspective.</span></h2>
                <div class="credential-rule"></div>
                <p>HESMK is led by a security and risk professional with operational experience in hostile environments and internationally recognized professional credentials, combining real-world insight with global best practices.</p>
              </div>

              <div class="reveal">
                <div class="credentials-name">
                  <h3>Khalid Habib</h3>
                  <div class="credentials-role">Security &amp; Risk Professional</div>
                  <div class="credentials-former">Former SSG Officer</div>
                </div>

                <div class="credential-cards">
                  <article class="credential-card">
                    <div class="credential-mark ssg"><img src="ssg-insignia.svg" alt="SSG insignia"></div>
                    <h4>Former SSG Officer</h4>
                    <div class="credential-rule"></div>
                    <p>Operational experience in hostile environments and counter-terrorism operations.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark">CPP<small>ASIS INTERNATIONAL</small></div>
                    <h4>Certified Protection Professional (CPP)</h4>
                    <div class="credential-rule"></div>
                    <p>Professional protection credential issued by ASIS International.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark">ISMI · CSMP<small>LEVEL 6</small></div>
                    <h4>Certified Security Management Professional Level 6</h4>
                    <div class="credential-rule"></div>
                    <p>Security management qualification associated with ISMI.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark">ASIS<small>INTERNATIONAL</small></div>
                    <h4>Professional Member</h4>
                    <div class="credential-rule"></div>
                    <p>Member of ASIS International and its global professional security community.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark">ISMI<small>UK</small></div>
                    <h4>Professional Member</h4>
                    <div class="credential-rule"></div>
                    <p>Member of the International Security Management Institute, UK.</p>
                  </article>
                </div>
                <p class="credentials-attribution">SSG insignia: supplied vector artwork; matching public vector source is licensed CC BY-SA 4.0.</p>
              </div>
            </div>
          </section>
          '''

          # Add CSS once.
          if 'LEADERSHIP & PROFESSIONAL CREDENTIALS' not in html:
              style_pos = html.rfind('</style>')
              if style_pos == -1:
                  raise SystemExit('Could not find closing style tag')
              html = html[:style_pos] + '\n' + css + '\n' + html[style_pos:]

          # Insert credentials once, directly before Sector Solutions.
          if 'id="credentials"' not in html:
              marker = '<!-- SECTORS -->'
              if marker not in html:
                  raise SystemExit('Could not locate Sector Solutions marker')
              html = html.replace(marker, section + '\n\n  ' + marker, 1)

          # Add clean navy resilience CTA before </main> once.
          if 'class="resilience-cta"' not in html:
              cta = r'''
          <section class="resilience-cta">
            <div class="container">
              <div>
                <div class="resilience-eyebrow">Operational Experience. International Best Practices.</div>
                <h2>A Safer, More Resilient Tomorrow.</h2>
              </div>
              <a class="btn btn-primary" href="#contact">Request Consultation →</a>
            </div>
          </section>
          '''
              if '</main>' not in html:
                  raise SystemExit('Could not locate end of main content')
              html = html.replace('</main>', cta + '\n</main>', 1)

          # Remove obsolete footer navigation links that refer to deleted homepage sections.
          html = html.replace('          <a href="#approach">Our Approach</a>\n', '')
          html = html.replace('          <a href="#insights">Insights</a>\n', '')

          path.write_text(html, encoding='utf-8')
          print('Credentials section, SSG insignia, and clean navy CTA/footer styling applied.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ssg-insignia.svg
          git diff --cached --quiet && exit 0
          git commit -m "Add leadership credentials and corporate resilience CTA"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/apply-credentials.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-credentials.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary credentials workflow"
          git push
