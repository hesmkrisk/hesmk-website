name: Final Credential Layout Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-credential-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final credential separation CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = '<style id="FINAL-CREDENTIAL-SEPARATION">'

          css = r'''<style id="FINAL-CREDENTIAL-SEPARATION">
          .credentials-section .credential-cards{
            width:calc(100% - 610px) !important;
            margin-left:610px !important;
            margin-right:0 !important;
            margin-top:12px !important;
            gap:8px !important;
            position:relative !important;
            z-index:5 !important;
          }

          .credentials-section .credential-card{
            height:210px !important;
            min-height:210px !important;
            padding:7px 8px 8px !important;
            border-radius:8px !important;
          }

          .credentials-section .credential-mark{
            height:50px !important;
            min-height:50px !important;
            margin-bottom:4px !important;
            padding:2px !important;
          }

          .credentials-section .credential-mark img{
            width:38px !important;
            height:38px !important;
            max-width:40px !important;
            max-height:38px !important;
          }

          .credentials-section .credential-mark strong{font-size:1.05rem !important;}
          .credentials-section .cpp-mark strong{font-size:1.28rem !important;}
          .credentials-section .csmp-mark strong{font-size:1.20rem !important;}
          .credentials-section .asis-mark strong{font-size:1.25rem !important;}
          .credentials-section .ismi-mark strong{font-size:.82rem !important;}

          .credentials-section .credential-card h4{
            font-size:.66rem !important;
            line-height:1.06 !important;
            min-height:29px !important;
            margin:2px 0 0 !important;
          }

          .credentials-section .credential-card .gold-rule.tiny{
            width:20px !important;
            margin:3px auto 4px !important;
          }

          .credentials-section .credential-card p{
            font-size:.53rem !important;
            line-height:1.18 !important;
            margin:0 !important;
          }

          @media(max-width:1100px){
            .credentials-section .credential-cards{
              width:100% !important;
              margin-left:0 !important;
              grid-template-columns:repeat(3,minmax(0,1fr)) !important;
            }
            .credentials-section .credential-card{
              height:auto !important;
              min-height:200px !important;
            }
          }

          @media(max-width:700px){
            .credentials-section .credential-cards{
              grid-template-columns:1fr 1fr !important;
              gap:8px !important;
            }
          }
          </style>'''

          if marker not in html:
              html = html.replace('</head>', css + '\n</head>', 1)
              path.write_text(html, encoding='utf-8')
          else:
              raise SystemExit('Final credential CSS already present; no change required.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply final credential layout separation"
          git push
