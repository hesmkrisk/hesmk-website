name: Connect HESMK Contact Form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect contact form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html, n = re.subn(r'<form class="contact-form reveal"[^>]*>', '<form class="contact-form reveal" action="https://formsubmit.co/ajax/info@hesmk.com.pk" method="POST" onsubmit="handleForm(event)">', html, count=1)
          if n != 1:
              raise SystemExit('Contact form opening tag not found.')
          marker = '<input type="hidden" name="_subject" value="New HESMK Website Security Inquiry">'
          if marker not in html:
              hidden = '''          <input type="hidden" name="_subject" value="New HESMK Website Security Inquiry">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_url" value="https://hesmk.com.pk/">
'''
              html = html.replace('          <div class="form-grid">', hidden + '          <div class="form-grid">', 1)
          html = html.replace('<div class="form-note">This demonstration form needs to be connected to your email/form service before going live.</div>', '<div class="form-note" id="formStatus" role="status" aria-live="polite">Your inquiry will be sent securely to HESMK.</div>', 1)
          pattern = r'    function handleForm\(event\) \{.*?\n    \}'
          replacement = '''    async function handleForm(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const status = document.getElementById('formStatus');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Sending…';
      status.textContent = 'Sending your confidential inquiry…';
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        const data = await response.json();
        if (response.ok && data.success !== false) {
          form.reset();
          status.textContent = 'Thank you. Your inquiry has been submitted to HESMK. We will respond as soon as possible.';
        } else {
          throw new Error(data.message || 'Submission failed');
        }
      } catch (error) {
        status.textContent = 'We could not submit the form right now. Please email info@hesmk.com.pk directly.';
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }'''
          html, n = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Existing handleForm function not found.')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/final-credential-fix.yml
          git commit -m "Connect HESMK contact form"
          git push
