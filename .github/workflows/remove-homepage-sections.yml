name: Remove selected homepage sections
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove selected homepage sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          sections = [
              ('<!-- WHY -->', '<!-- FOUNDER -->'),
              ('<!-- FOUNDER -->', '<!-- FRAMEWORKS -->'),
              ('<!-- FRAMEWORKS -->', '<!-- ROI -->'),
              ('<!-- ROI -->', '<!-- INSIGHTS -->'),
              ('<!-- INSIGHTS -->', '<!-- CONTACT -->'),
          ]
          for start, end in sections:
              pattern = re.escape(start) + r'.*?' + re.escape(end)
              s, n = re.subn(pattern, end, s, count=1, flags=re.S|re.I)
              if n != 1:
                  raise SystemExit(f'Could not remove section between {start} and {end}')
          s, n = re.subn(r'\s*<a href="#insights" onclick="closeMenu\(\)">Insights</a>\s*', '\n', s, count=1)
          if n != 1:
              raise SystemExit('Could not remove Insights navigation link')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '<!-- WHY -->' index.html
          ! grep -q '<!-- FOUNDER -->' index.html
          ! grep -q '<!-- FRAMEWORKS -->' index.html
          ! grep -q '<!-- ROI -->' index.html
          ! grep -q '<!-- INSIGHTS -->' index.html
          ! grep -q 'href="#insights"' index.html
          grep -q '<!-- CONTACT -->' index.html

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hesmkrisk'
          git config user.email 'kahut4777@gmail.com'
          git add index.html
          git rm -f .github/workflows/remove-homepage-sections.yml
          git add -A
          git commit -m 'Remove selected sections from homepage'
          git push origin main
