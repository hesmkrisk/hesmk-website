name: Credential Spacing Fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply spacing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
<style id="credential-spacing-fix">
.credentials-section .credential-cards{
  width:calc(100% - 625px) !important;
  margin-left:625px !important;
  margin-right:0 !important;
  margin-top:10px !important;
  gap:8px !important;
  position:relative !important;
  z-index:3 !important;
}
.credentials-section .credential-card{
  height:208px !important;
  min-height:208px !important;
  padding:7px 8px !important;
  border-radius:8px !important;
}
.credentials-section .credential-mark{
  height:54px !important;
  min-height:54px !important;
  margin-bottom:4px !important;
  padding:2px !important;
}
.credentials-section .credential-mark img{
  width:44px !important;
  height:44px !important;
  max-width:46px !important;
  max-height:44px !important;
}
.credentials-section .credential-mark strong{font-size:1.16rem !important}
.credentials-section .cpp-mark strong{font-size:1.40rem !important}
.credentials-section .csmp-mark strong{font-size:1.30rem !important}
.credentials-section .asis-mark strong{font-size:1.36rem !important}
.credentials-section .ismi-mark strong{font-size:.92rem !important}
.credentials-section .credential-card h4{font-size:.69rem !important;line-height:1.06 !important;min-height:29px !important;margin:2px 0 0 !important}
.credentials-section .credential-card .gold-rule.tiny{width:22px !important;margin:4px auto !important}
.credentials-section .credential-card p{font-size:.56rem !important;line-height:1.20 !important}
@media(max-width:1100px){.credentials-section .credential-cards{width:100% !important;margin-left:0 !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important}.credentials-section .credential-card{height:auto !important;min-height:205px !important}}
@media(max-width:700px){.credentials-section .credential-cards{grid-template-columns:1fr 1fr !important;gap:8px !important}.credentials-section .credential-card{min-height:200px !important}}
</style>
'''
          if 'id="credential-spacing-fix"' not in s:
              s=s.replace('</style>',css+'</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix credential card spacing and separation"
          git push
          git rm .github/workflows/credential-spacing-fix.yml
          git commit -m "Remove temporary credential spacing workflow"
          git push
