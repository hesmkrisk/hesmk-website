name: Connect HESMK Contact Form

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect-form:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect contact form to Formspree
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          endpoint = 'https://formspree.io/f/mqpazbqp'
          html, n = re.subn(
              r'<form class="contact-form reveal"[^>]*>',
              '<form id="contact-form" class="contact-form reveal" action="' + endpoint + '" method="POST">',
              html,
              count=1
          )
          if n != 1:
              raise SystemExit('Contact form opening tag not found.')

          html = html.replace(
              '<div class="form-actions">\n            <div class="form-note">This demonstration form needs to be connected to your email/form service before going live.</div>',
              '<div class="form-actions">\n            <div class="form-note" data-fs-success aria-live="polite">Your inquiry will be sent securely to HESMK.</div>',
              1
          )

          html = re.sub(
              r'\n    function handleForm\(event\) \{.*?\n    \}\n',
              '\n',
              html,
              count=1,
              flags=re.S
          )

          formspree_script = '''\n    <script>\n      window.formspree = window.formspree || function () {\n        (formspree.q = formspree.q || []).push(arguments);\n      };\n      formspree('initForm', {\n        formElement: '#contact-form',\n        formId: 'mqpazbqp'\n      });\n    </script>\n    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>\n'''

          if "@formspree/ajax@1" not in html:
              html = html.replace('</body>', formspree_script + '</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-ssg-credential-box.yml
          git commit -m "Connect HESMK contact form to Formspree"
          git push
