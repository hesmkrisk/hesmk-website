name: Add Matching SSG Credential Box

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-ssg-box:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply matching SSG credential box styling
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<style id="SSG-CREDENTIAL-BOX">'

          css = r'''<style id="SSG-CREDENTIAL-BOX">
          /* Match the SSG insignia area to the cream credential-logo panels */
          .credentials-section .ssg-mark{
            background:#fbfaf6 !important;
            border:1px solid #eee8dc !important;
            box-sizing:border-box !important;
          }
          .credentials-section .ssg-mark img{
            display:block !important;
            margin:auto !important;
          }
          </style>'''

          if marker in html:
              raise SystemExit('SSG credential box styling already present; no change required.')

          html = html.replace('</head>', css + '\n</head>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match SSG credential logo panel"
          git push
