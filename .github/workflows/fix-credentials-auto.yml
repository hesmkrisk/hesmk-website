name: Fix Credentials Alignment

on:
  push:
    branches: [main]

jobs:
  update-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace credentials section with approved symmetrical layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->'
          if marker not in html:
              raise SystemExit('Credentials section marker not found')
          start = html.index(marker)
          end = html.index('</section>', start) + len('</section>')

          section = '''<!-- LEADERSHIP & PROFESSIONAL CREDENTIALS -->
          <section class="section credentials-section" id="credentials">
            <div class="container credentials-wrap">
              <div class="credentials-eyebrow eyebrow">Leadership &amp; Professional Credentials</div>

              <div class="credentials-header">
                <div class="credentials-heading">
                  <h2>Experience.<br>Certification.<br>Global Perspective.</h2>
                  <div class="credentials-heading-rule"></div>
                </div>

                <div class="credentials-profile">
                  <h3>Khalid Habib</h3>
                  <div class="credentials-role">Security &amp; Risk Professional</div>
                  <div class="credentials-profile-rule"></div>
                  <div class="credentials-former">Former SSG Officer</div>
                </div>

                <div class="credentials-quote">
                  <div class="quote-mark">“</div>
                  <p>Turning security<br>challenges into<br>resilient opportunities.</p>
                  <div class="credentials-profile-rule"></div>
                </div>
              </div>

              <div class="credentials-body">
                <div class="credentials-copy">
                  <div class="credential-rule"></div>
                  <p>HESMK is led by a security and risk professional with operational experience in hostile environments and internationally recognized professional credentials, combining real-world insight with global best practices.</p>
                </div>

                <div class="credential-cards">
                  <article class="credential-card">
                    <div class="credential-mark ssg"><img src="ssg.png" alt="SSG insignia"></div>
                    <h4>Former SSG Officer</h4>
                    <div class="credential-rule"></div>
                    <p>Operational experience in hostile environments and counter-terrorism operations.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark cpp">CPP<small>ASIS INTERNATIONAL</small></div>
                    <h4>Certified Protection Professional (CPP)</h4>
                    <div class="credential-rule"></div>
                    <p>Professional protection credential issued by ASIS International.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark csmp">ISMI · CSMP<small>LEVEL 6</small></div>
                    <h4>Certified Security Management Professional Level 6</h4>
                    <div class="credential-rule"></div>
                    <p>Security management qualification associated with ISMI.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark asis">ASIS<small>INTERNATIONAL</small></div>
                    <h4>Professional Member</h4>
                    <div class="credential-rule"></div>
                    <p>Member of ASIS International and its global professional security community.</p>
                  </article>

                  <article class="credential-card">
                    <div class="credential-mark wordmark ismi">ISMI<small>UK</small></div>
                    <h4>Professional Member</h4>
                    <div class="credential-rule"></div>
                    <p>Member of the International Security Management Institute, UK.</p>
                  </article>
                </div>
              </div>
            </div>
          </section>'''

          html = html[:start] + section + html[end:]

          css = '''
          /* APPROVED CREDENTIALS MOCKUP — FINAL SYMMETRICAL LAYOUT */
          .credentials-section{background:var(--white);padding:60px 0 54px;}
          .credentials-wrap{width:min(92%,var(--max));margin:auto;}
          .credentials-eyebrow{margin:0 0 22px;}
          .credentials-header{display:grid;grid-template-columns:1.05fr 1.5fr .72fr;gap:42px;align-items:start;}
          .credentials-heading{padding:10px 40px 0 0;border-right:1px solid rgba(8,24,39,.18);}
          .credentials-heading h2{font-family:Georgia,serif;color:var(--navy);font-size:clamp(3rem,4.65vw,4.25rem);line-height:1.03;letter-spacing:-.035em;margin:0;}
          .credentials-heading-rule{width:42px;height:2px;background:var(--accent);margin-top:28px;}
          .credentials-profile{padding-top:4px;}
          .credentials-profile h3{font-family:Georgia,serif;color:var(--navy);font-size:clamp(2.75rem,4vw,4rem);line-height:1;margin:0 0 9px;letter-spacing:-.035em;}
          .credentials-role{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.19em;color:var(--accent);font-size:.79rem;font-weight:700;}
          .credentials-profile-rule{width:42px;height:2px;background:var(--accent);margin:16px 0 13px;}
          .credentials-former{font-family:Georgia,serif;color:var(--navy);font-size:1.15rem;}
          .credentials-quote{padding:5px 0 0 10px;color:#294968;}
          .credentials-quote .quote-mark{font-family:Georgia,serif;color:var(--accent);font-size:5rem;line-height:.4;margin:0 0 18px;}
          .credentials-quote p{font-family:Georgia,serif;font-size:1.14rem;font-style:italic;line-height:1.42;margin:0;}
          .credentials-quote .credentials-profile-rule{margin-top:18px;}
          .credentials-body{display:grid;grid-template-columns:minmax(260px,.82fr) minmax(0,2.18fr);gap:36px;align-items:start;margin-top:24px;}
          .credentials-copy{padding-right:12px;}
          .credentials-copy .credential-rule{margin:0 0 18px;}
          .credentials-copy p{max-width:405px;color:#2e5674;font-size:.98rem;line-height:1.6;margin:0;}
          .credential-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch;}
          .credential-card{height:318px;min-height:318px;padding:16px 13px;background:#fff;border:1px solid rgba(8,24,39,.12);border-radius:12px;box-shadow:0 10px 25px rgba(8,24,39,.055);display:flex;flex-direction:column;overflow:hidden;}
          .credential-mark{height:100px;flex:0 0 100px;width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--navy);font-family:Georgia,serif;font-weight:800;}
          .credential-mark.ssg img{display:block;width:82px;height:92px;object-fit:contain;}
          .credential-mark.wordmark{border:1px solid rgba(184,148,85,.22);background:#faf8f3;border-radius:8px;flex-direction:column;text-align:center;line-height:1.05;font-size:1.35rem;letter-spacing:.04em;}
          .credential-mark.wordmark small{display:block;font-family:Inter,ui-sans-serif,sans-serif;font-size:.5rem;letter-spacing:.09em;color:#607080;margin-top:9px;font-weight:700;}
          .credential-card h4{font-family:Georgia,serif;color:var(--navy);font-size:.91rem;line-height:1.18;text-align:center;margin:0 0 7px;min-height:45px;display:flex;align-items:center;justify-content:center;}
          .credential-card .credential-rule{width:42px;height:2px;background:var(--accent);margin:5px auto 12px;flex:0 0 auto;}
          .credential-card p{font-size:.76rem;color:#607080;line-height:1.5;margin:0;}
          .credentials-attribution{display:none!important;}

          @media(max-width:1100px){
            .credentials-header{grid-template-columns:1fr 1.25fr;gap:28px;}
            .credentials-quote{grid-column:1 / -1;display:flex;align-items:flex-start;gap:14px;padding:0;}
            .credentials-quote .quote-mark{margin:0;}
            .credentials-quote p{padding-top:7px;}
            .credentials-body{grid-template-columns:1fr;gap:24px;}
            .credentials-copy p{max-width:760px;}
            .credential-cards{grid-template-columns:repeat(3,minmax(0,1fr));}
          }
          @media(max-width:700px){
            .credentials-section{padding:52px 0 44px;}
            .credentials-header{grid-template-columns:1fr;gap:18px;}
            .credentials-heading{border-right:0;border-bottom:1px solid rgba(8,24,39,.16);padding:0 0 22px;}
            .credentials-heading h2{font-size:2.7rem;}
            .credentials-profile{padding-top:0;}
            .credentials-profile h3{font-size:2.75rem;}
            .credentials-quote{grid-column:auto;}
            .credentials-body{margin-top:24px;}
            .credential-cards{grid-template-columns:1fr 1fr;}
          }
          @media(max-width:440px){
            .credential-cards{grid-template-columns:1fr;}
            .credential-card{height:auto;min-height:280px;}
          }
          '''

          pos=html.rfind('</style>')
          if pos == -1:
              raise SystemExit('Closing style tag not found')
          html=html[:pos] + '\n' + css + '\n' + html[pos:]
          path.write_text(html,encoding='utf-8')
          print('Approved credentials layout restored with supplied SSG logo and exact corporate hierarchy.')
          PY

      - name: Commit update and clean temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix credentials symmetry and SSG branding"
          rm -f .github/workflows/fix-credentials-layout.yml .github/workflows/fix-credentials-auto.yml
          git add .github/workflows/fix-credentials-layout.yml .github/workflows/fix-credentials-auto.yml
          git commit -m "Remove temporary credentials workflows"
          git push
