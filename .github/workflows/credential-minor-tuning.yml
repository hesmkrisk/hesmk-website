name: Credential Minor Tuning

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tune-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minor credential refinements
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<style id="CREDENTIAL-MINOR-TUNING-V2">'
          css = r'''<style id="CREDENTIAL-MINOR-TUNING-V2">
          /* Minor credential refinements: CPP registered mark, CSMP centering, simplified ISMI */
          .credentials-section .cpp-mark{position:relative !important;}
          .credentials-section .cpp-mark strong{position:relative !important;left:4px !important;}
          .credentials-section .cpp-mark sup{position:relative !important;left:3px !important;top:-0.28em !important;font-size:.42em !important;}
          .credentials-section .csmp-mark{justify-content:center !important;text-align:center !important;padding-left:0 !important;padding-right:0 !important;}
          .credentials-section .csmp-mark strong{position:relative !important;left:0 !important;}
          .credentials-section .ismi-mark{position:relative !important;}
          .credentials-section .ismi-mark strong{font-size:1.05rem !important;letter-spacing:-.045em !important;font-family:Arial,sans-serif !important;}
          .credentials-section .ismi-mark .gold-bar{display:block !important;width:24px !important;height:2px !important;background:var(--accent) !important;margin:5px auto 0 !important;}
          </style>'''
          if marker not in html:
              html = html.replace('</head>', css + '\n</head>', 1)
              old = '<div class="credential-mark ismi-mark"><strong>ISMI</strong><span>INTERNATIONAL SECURITY<br>MANAGEMENT INSTITUTE</span></div>'
              new = '<div class="credential-mark ismi-mark"><strong>ISMI</strong><span>INTERNATIONAL SECURITY<br>MANAGEMENT INSTITUTE</span><span class="gold-bar"></span></div>'
              if old in html:
                  html = html.replace(old, new, 1)
              else:
                  raise SystemExit('Expected ISMI markup not found; no change made.')
              path.write_text(html, encoding='utf-8')
          else:
              raise SystemExit('V2 credential tuning already present; no change required.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine ISMI credential mark"
          git push
