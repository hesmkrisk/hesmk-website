name: Apply Risk Cycle Option 6
on: push
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply horizontal arrow flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* RISK CYCLE — OPTION 6: EXECUTIVE HORIZONTAL ARROW FLOW */
          .risk-chain .chain {
            display:grid !important;
            grid-template-columns:repeat(5,minmax(0,1fr)) !important;
            grid-auto-rows:48px !important;
            column-gap:0 !important;
            row-gap:12px !important;
            align-items:stretch !important;
            width:100% !important;
          }
          .risk-chain .chain b { display:none !important; }
          .risk-chain .chain span {
            position:relative !important;
            grid-column:auto !important;
            grid-row:auto !important;
            display:flex !important;
            align-items:center !important;
            justify-content:center !important;
            min-width:0 !important;
            height:48px !important;
            margin:0 3px 0 0 !important;
            padding:0 14px 0 22px !important;
            border:0 !important;
            border-radius:0 !important;
            background:linear-gradient(135deg,#162e42,#102538) !important;
            color:#fff !important;
            font-size:.76rem !important;
            font-weight:800 !important;
            line-height:1.1 !important;
            text-align:center !important;
            white-space:nowrap !important;
            clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%) !important;
          }
          .risk-chain .chain span:nth-of-type(1),
          .risk-chain .chain span:nth-of-type(6) { padding-left:14px !important; }
          .risk-chain .chain span:nth-of-type(6) { grid-column:2 !important; }
          .risk-chain .chain span:nth-of-type(7) { grid-column:3 !important; }
          .risk-chain .chain span:nth-of-type(8) { grid-column:4 !important; }
          .risk-chain .chain span:nth-of-type(9) {
            grid-column:5 !important;
            background:linear-gradient(135deg,#c39b57,#b89455) !important;
            color:#fff !important;
          }
          .risk-chain .chain span:nth-of-type(6)::before {
            content:"" !important;
            position:absolute !important;
            left:-25px !important;
            top:50% !important;
            width:34px !important;
            height:2px !important;
            background:var(--accent-light) !important;
            transform:translateY(-50%) !important;
          }
          .risk-chain .chain span:nth-of-type(6)::after {
            content:"" !important;
            position:absolute !important;
            left:-2px !important;
            top:50% !important;
            width:9px !important;
            height:9px !important;
            border-top:2px solid var(--accent-light) !important;
            border-left:2px solid var(--accent-light) !important;
            transform:translateY(-50%) rotate(-45deg) !important;
          }
          @media(max-width:650px){
            .risk-chain .chain {
              grid-template-columns:repeat(2,minmax(0,1fr)) !important;
              grid-auto-rows:42px !important;
              row-gap:10px !important;
            }
            .risk-chain .chain span {
              height:42px !important;
              font-size:.66rem !important;
              padding:0 8px 0 16px !important;
            }
            .risk-chain .chain span:nth-of-type(1){grid-column:1 !important;}
            .risk-chain .chain span:nth-of-type(2){grid-column:2 !important;}
            .risk-chain .chain span:nth-of-type(3){grid-column:1 !important;grid-row:2 !important;}
            .risk-chain .chain span:nth-of-type(4){grid-column:2 !important;grid-row:2 !important;}
            .risk-chain .chain span:nth-of-type(5){grid-column:1 !important;grid-row:3 !important;}
            .risk-chain .chain span:nth-of-type(6){grid-column:2 !important;grid-row:3 !important;}
            .risk-chain .chain span:nth-of-type(7){grid-column:1 !important;grid-row:4 !important;}
            .risk-chain .chain span:nth-of-type(8){grid-column:2 !important;grid-row:4 !important;}
            .risk-chain .chain span:nth-of-type(9){grid-column:1 / span 2 !important;grid-row:5 !important;}
            .risk-chain .chain span:nth-of-type(6)::before,
            .risk-chain .chain span:nth-of-type(6)::after{display:none !important;}
          }
          '''
          s=s.replace('</style>',css+'\n  </style>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply executive horizontal risk cycle flow"
          git push
          git rm .github/workflows/apply-risk-cycle-option6.yml
          git commit -m "Remove temporary risk cycle workflow"
          git push
