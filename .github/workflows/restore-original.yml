name: Restore Original Website

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index to pre-change version
        run: |
          git fetch origin f68066bd019325a19362e73f8fbffbc9346d5aa9 --depth=1
          git restore --source=f68066bd019325a19362e73f8fbffbc9346d5aa9 -- index.html
          rm -f .github/workflows/replace-credentials-final.yml
          rm -f .github/workflows/restore-original.yml
      - name: Commit restored website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/replace-credentials-final.yml .github/workflows/restore-original.yml
          git diff --cached --quiet || git commit -m "Restore original website"
          git push
