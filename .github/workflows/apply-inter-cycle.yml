name: Apply Inter Typography to Risk Cycle
on: push
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Inter typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* RISK CYCLE — INTER SEMIBOLD 600 */
          .risk-chain .chain span {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-weight: 600 !important;
            letter-spacing: 0 !important;
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
          }
          '''
          font='''\n          @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap");\n          '''
          if 'fonts.googleapis.com/css2?family=Inter' not in s:
              s=s.replace('</style>',font+'</style>',1)
          s=s.replace('</style>',css+'\n  </style>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          git commit -m "Use Inter Semibold for risk cycle labels"
          git push
          git rm .github/workflows/apply-inter-cycle.yml
          git commit -m "Remove temporary Inter typography workflow"
          git push
