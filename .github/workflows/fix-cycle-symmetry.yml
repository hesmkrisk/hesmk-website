name: Fix Risk Cycle Symmetry
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add symmetric cycle styling
        run: python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); css="""\n    /* RISK CYCLE SYMMETRIC OVERRIDE */\n    .risk-chain .chain {\n      display: grid !important;\n      grid-template-columns: minmax(0,1fr) 24px minmax(0,1fr) 24px minmax(0,1fr) !important;\n      column-gap: 6px !important;\n      row-gap: 16px !important;\n      align-items: center !important;\n      width: 100%;\n    }\n\n    .risk-chain .chain span {\n      position: relative;\n      grid-column: auto !important;\n      grid-row: auto !important;\n      text-align: center !important;\n      white-space: nowrap !important;\n      padding: 10px 8px;\n      font-size: .74rem;\n    }\n\n    .risk-chain .chain b { display: none !important; }\n\n    .risk-chain .chain span:nth-of-type(1)::after,\n    .risk-chain .chain span:nth-of-type(2)::after,\n    .risk-chain .chain span:nth-of-type(4)::after,\n    .risk-chain .chain span:nth-of-type(5)::after,\n    .risk-chain .chain span:nth-of-type(7)::after,\n    .risk-chain .chain span:nth-of-type(8)::after {\n      content: "→";\n      position: absolute;\n      right: -20px;\n      top: 50%;\n      transform: translateY(-50%);\n      color: var(--accent-light);\n      font-weight: 800;\n      font-size: .82rem;\n    }\n\n    .risk-chain .chain span:nth-of-type(3)::after,\n    .risk-chain .chain span:nth-of-type(6)::after {\n      content: "↓";\n      position: absolute;\n      left: 50%;\n      top: calc(100% + 4px);\n      transform: translateX(-50%);\n      color: var(--accent-light);\n      font-weight: 800;\n      font-size: .86rem;\n    }\n\n    @media (max-width: 650px) {\n      .risk-chain .chain {\n        grid-template-columns: minmax(0,1fr) 16px minmax(0,1fr) 16px minmax(0,1fr) !important;\n        column-gap: 4px !important;\n        row-gap: 14px !important;\n      }\n      .risk-chain .chain span {\n        font-size: .66rem;\n        padding: 8px 4px;\n      }\n      .risk-chain .chain span:nth-of-type(1)::after,\n      .risk-chain .chain span:nth-of-type(2)::after,\n      .risk-chain .chain span:nth-of-type(4)::after,\n      .risk-chain .chain span:nth-of-type(5)::after,\n      .risk-chain .chain span:nth-of-type(7)::after,\n      .risk-chain .chain span:nth-of-type(8)::after {\n        right: -14px;\n        font-size: .74rem;\n      }\n    }\n"""; s=s.replace("</style>",css+"\n  </style>",1); p.write_text(s,encoding="utf-8")' 
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Arrange risk-informed cycle symmetrically"
          git push
          git rm .github/workflows/fix-cycle-symmetry.yml
          git commit -m "Remove temporary cycle workflow"
          git push
