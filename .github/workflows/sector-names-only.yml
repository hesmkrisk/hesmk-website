name: Remove sector solution descriptions
on:
  push:
    paths:
      - '.github/workflows/sector-names-only.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove descriptions from sector cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('id="sectors"')
          if start < 0: raise SystemExit('Sectors section not found')
          end = s.find('</section>', start)
          if end < 0: raise SystemExit('Sectors section end not found')
          block = s[start:end]
          block2 = re.sub(r'\s*<p[^>]*>.*?</p>', '', block, flags=re.S)
          if block2 == block: raise SystemExit('No sector descriptions found')
          s = s[:start] + block2 + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'Foreign Workers Protection' index.html
          grep -q 'CPEC Projects Protection' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find('id="sectors"'); end=s.find('</section>',start)
          assert start>=0 and end>start
          block=s[start:end]
          assert '<p' not in block, 'Sector descriptions remain'
          print('Validated: sector cards contain names only')
          PY
      - name: Commit and cleanup
        run: |
          git config user.name 'HESMK Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show sector names only' || true
          git push
          rm -f .github/workflows/sector-names-only.yml
          git add .github/workflows/sector-names-only.yml
          git commit -m 'Remove temporary sector update workflow'
          git push
