name: Apply HESMK Simplified Risk Flow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply simplified seven-step risk flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_css = re.compile(
              r'/\* HESMK — THREE-LEVEL RISK-TO-RESILIENCE FLOW \*/.*?(?=\n    /\* METHODOLOGY \*/)',
              re.S
          )

          new_css = r'''/* HESMK — SIMPLE SEVEN-STEP RISK-TO-RESILIENCE FLOW */
    .risk-chain .chain {
      display: grid;
      grid-template-columns: repeat(13, minmax(0, 1fr));
      column-gap: 8px;
      row-gap: 12px;
      align-items: center;
    }

    .risk-chain .chain span {
      text-align: center;
      white-space: normal;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 7px;
      line-height: 1.15;
    }

    .risk-chain .chain b {
      color: var(--accent-light);
      text-align: center;
      font-size: .9rem;
      font-weight: 700;
    }

    /* Context → Threat → Vulnerabilities → Consequence → Risk → Control → Resilience */
    .risk-chain .chain span:nth-child(1) { grid-column: 1 / span 2; }
    .risk-chain .chain b:nth-child(2) { grid-column: 3; }
    .risk-chain .chain span:nth-child(3) { grid-column: 4 / span 2; }
    .risk-chain .chain b:nth-child(4) { grid-column: 6; }
    .risk-chain .chain span:nth-child(5) { grid-column: 7 / span 2; }
    .risk-chain .chain b:nth-child(6) { grid-column: 9; }
    .risk-chain .chain span:nth-child(7) { grid-column: 10 / span 2; }
    .risk-chain .chain b:nth-child(8) { grid-column: 12; }
    .risk-chain .chain span:nth-child(9) { grid-column: 13; }

    @media (max-width: 900px) {
      .risk-chain .chain {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        column-gap: 6px;
      }
      .risk-chain .chain span:nth-child(1) { grid-column: 1; }
      .risk-chain .chain b:nth-child(2) { grid-column: 2; }
      .risk-chain .chain span:nth-child(3) { grid-column: 3; }
      .risk-chain .chain b:nth-child(4) { grid-column: 4; }
      .risk-chain .chain span:nth-child(5) { grid-column: 5; }
      .risk-chain .chain b:nth-child(6) { grid-column: 6; }
      .risk-chain .chain span:nth-child(7) { grid-column: 7; }
      .risk-chain .chain b:nth-child(8) { display: none; }
      .risk-chain .chain span:nth-child(9) { display: none; }
    }

    @media (max-width: 680px) {
      .risk-chain .chain {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 7px;
      }
      .risk-chain .chain span {
        flex: 0 1 auto;
        min-width: 105px;
      }
      .risk-chain .chain b {
        display: inline-block;
      }
    }
'''

          s2, n = old_css.subn(new_css, s, count=1)
          if n != 1:
              raise SystemExit("Expected risk-flow CSS block was not found.")

          old_html = '<div class="chain">\n            <span>Context</span><b>→</b><span>Assets</span><b>→</b><span>Threats</span><b>→</b><span>Vulnerabilities</span><b>→</b><span>Consequences</span><b>→</b><span>Risk</span><b>→</b><span>Controls</span><b>→</b><span>Cost</span><b>→</b><span>Resilience</span>\n          </div>'
          new_html = '<div class="chain">\n            <span>Context</span><b>→</b><span>Threat</span><b>→</b><span>Vulnerabilities</span><b>→</b><span>Consequence</span><b>→</b><span>Risk</span><b>→</b><span>Control</span><b>→</b><span>Resilience</span>\n          </div>'

          if old_html not in s2:
              raise SystemExit("Expected risk-flow HTML was not found.")
          s2 = s2.replace(old_html, new_html, 1)

          p.write_text(s2, encoding="utf-8")
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-simple-risk-flow.yml
          git commit -m "Simplify HESMK risk flow"
          git push
          git rm .github/workflows/apply-simple-risk-flow.yml
          git commit -m "Remove temporary risk flow workflow"
          git push
