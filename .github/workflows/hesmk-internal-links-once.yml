name: HESMK SEO Internal Links
on:
  push:
    branches:
      - main
    paths:
      - sitemap.xml
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage capability links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<div class="cap-cell capability">Protective Security</div>': '<div class="cap-cell capability"><a href="physical-protective-security.html">Protective Security</a></div>',
              '<div class="cap-cell capability">Threat &amp; Counter-Terrorism Advisory</div>': '<div class="cap-cell capability"><a href="counter-terrorism-threat-management.html">Threat &amp; Counter-Terrorism Advisory</a></div>',
              '<div class="cap-cell capability">Physical Security</div>': '<div class="cap-cell capability"><a href="physical-protective-security.html">Physical Security</a></div>',
              '<div class="cap-cell capability">Crisis &amp; Emergency Management</div>': '<div class="cap-cell capability"><a href="organizational-resilience-business-continuity.html">Crisis &amp; Emergency Management</a></div>',
              '<div class="cap-cell capability">Business Continuity &amp; Resilience</div>': '<div class="cap-cell capability"><a href="organizational-resilience-business-continuity.html">Business Continuity &amp; Resilience</a></div>',
              '<div class="cap-cell capability">Security Governance &amp; Risk Advisory</div>': '<div class="cap-cell capability"><a href="security-governance-risk-advisory.html">Security Governance &amp; Risk Advisory</a></div>'
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          marker = '/* SEO STEP 7 - INTERNAL SERVICE LINKS */'
          css = '''
          /* SEO STEP 7 - INTERNAL SERVICE LINKS */
          .cap-cell.capability a { color: inherit; text-decoration: none; }
          .cap-cell.capability a:hover { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(184,148,85,.55); text-underline-offset: 3px; }
          '''
          if changed and marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          if not changed:
              raise SystemExit('No capability text needed updating')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "SEO Step 7: add internal service links"
          git push
